ints in a borehole, as between the point where the hole first encounters a specific rock or mineral body and where the hole enters a different or underlying rock formation.", "Огтлолцсон интервал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Interpolation", "Интерполяци", "Estimation of a statistical value from its mathematical or graphical position intermediate in a series of determined points.", "Интерполяци — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["In rush", "Гэнэтийн нэвтрэлт", "A sudden ingress of air, fluid, or fluidised material from a drawpoint or other underground opening.", "Гэнэтийн нэвтрэлт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["In situ fragmentation", "Байрлал дахь анхдагч бутрал", "The fragmentation of the in situ rock before it has been disturbed by undercutting or caving.", "Байрлал дахь анхдагч бутрал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["In situ stress", "Байрлал дахь хүчдэл", "The state of stress in the in situ rock before it has been disturbed by construction or mining activity.", "Байрлал дахь хүчдэл — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Interactive draw (flow)", "Харилцан үйлчлэлтэй хүдэр буулгалт (урсгал)", "A mechanism by which the caved rock in adjacent drawzones may migrate from one draw column to the other to create a condition of mass flow (uniform draw) above the height at which these drawzones interact (touch), known as the height of interaction (HIZ). A prerequisite to achieving interactive draw is that that the drawpoints are spaced sufficiently close and drawndown is controlled through good drawcontrol practices.", "Харилцан үйлчлэлтэй хүдэр буулгалт (урсгал) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Isolated draw zone (IDZ)", "Тусгаарлагдсан хүдэр буулгалтын бүс (IDZ)", "A drawzone isolated from other drawzones as a consequence of being spaced too far away for any interaction to occur with it’s neighboring drawpoints.", "Тусгаарлагдсан хүдэр буулгалтын бүс (IDZ) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Isolated extraction zone (IEZ)", "Тусгаарлагдсан олборлолтын бүс (IEZ)", "The zone within a mass of caved or broken ore or rock from which all the material discharged from a bottom outlet after a given period of time will have originated. Equivalent to the ellipsoid of motion, draw or extraction, but not necessarily ellipsoidal in shape.", "Тусгаарлагдсан олборлолтын бүс (IEZ) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Isolated movement zone (IMZ)", "Тусгаарлагдсан хөдөлгөөний бүс (IMZ)", "The zone of broken ore or rock that will have moved, but not necessarily have been discharged, when a bottom outlet is opened or draw occurs. Equivalent to the isolated draw zone and the limit or loosening ellipsoid, but not necessarily ellipsoidal in shape.", "Тусгаарлагдсан хөдөлгөөний бүс (IMZ) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Isostatic", "Изостатик", "Subjected to equal pressure from every side; being in hydrostatic equilibrium;", "Изостатик — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Isotropy", "Изотропи", "The condition used to describe a medium with properties that are identical in all directions; as opposed to anisotropy", "Изотропи — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Joint condition", "Ан цавын төлөв", "A description (usually expressed as an index) of the total strength parameters of the joint walls and infill that dictate the shear strength of the joint. Parameters comprising joint condition include; joint wall roughness, joint planarity, joint wall alteration, infill thickness and composition and weathering.", "Ан цавын төлөв — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Joints", "Ан цавууд", "Natural cracks or fractures in rocks. They tend to occur in more or less parallel systems", "Ан цавууд — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Joint set", "Ан цавын систем", "A group of more or less parallel joints.", "Ан цавын систем — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Joint system", "Ан цавын нийлмэл систем", "Consists of two or more joint sets or any group of joints with a characteristic pattern, such as a radiating pattern and a concentric pattern.", "Ан цавын нийлмэл систем — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Jointstats", "JointStats программ", "Software developed by JKMRC that creates a statistically representation DFN of the rock mass based on mapped or logged joint data.", "JointStats программ — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Koepe hoist", "Кёпе өргүүр", "A winding system in which both cages in a mine shaft are connected to the same rope, via the drum.", "Кёпе өргүүр — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Koepe winder", "Кёпе өргөх машин", "A system where the winding drum is replaced by a large wheel or sheave. Both cages are connected to the same rope, which passes around some 200 degrees of the sheave in a groove of friction material. The Koepe sheave may be mounted on the ground adjacent to the headgear or in a tower over the shaft. The drive to the rope is the frictional resistance between the rope and the sheave. It requires the use of a balance rope. It is often used for hoisting heavy loads from deep shafts and has the advantage that the large inertia of the ordinary winding drum is avoided.", "Кёпе өргөх машин — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Kriging", "Кригинг интерполяцийн арга", "In the estimation of ore reserves by geostatistical methods, the use of a weighted moving-average interpolation method in which the set of weights assigned to samples minimizes the estimation variance, which is computed as a function of the variogram model and locations of the samples relative to each other, and to the point or block being estimated, and also to assess the probable error associated with the estimates.", "Кригинг интерполяцийн арга — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Lacing", "Торон бэхэлгээний холбоос", "A South African term refering to cables threaded through eyebolts and tensioned. In conjunction with mesh this support holds back all loose material.", "Торон бэхэлгээний холбоос — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Lagging", "Ар талын бэхэлгээний банз/тор", "To place planks, slabs, or small timbers over horizontal, or behind upright, members of mine timber sets to form a ceiling or wall.", "Ар талын бэхэлгээний банз/тор — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Lateral support", "Хажуугийн бэхэлгээ", "Means whereby walls are braced either vertically or horizontally using various support elements or methods (eg. Straps installed parallel to the tunnel axis).", "Хажуугийн бэхэлгээ — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Lattice girder", "Торон нуман дам нуруу", "An open girder, beam, or column in timber, steel, or aluminium alloy, built up from structural members joined and braced together by intersecting diagonal bars.", "Торон нуман дам нуруу — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Layout", "Зохион байгуулалт", "The design or pattern of the main roadways and workings (in caving this typically refers to the extraction level drives and drawpoint configuration).", "Зохион байгуулалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Lead-Lag", "Тэргүүлэх-дагах дараалал", "The distance measured between the advancing faces of neighboring drives on the undercut or sublevel cave stope. A maximum lead-lag distance is the distance that must not be exceeded so as to ensure the overal uniformity and stability of the front.", "Тэргүүлэх-дагах дараалал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Life of mine", "Уурхайн ашиглалтын хугацаа", "The time in which, through the employment of the available capital, the ore reserves will be extracted.", "Уурхайн ашиглалтын хугацаа — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Lifters", "Өргөгч өрөмдлөгийн цооногууд", "In mining, shotholes drilled near the floor when tunneling and fired subsequently to the cut and relief holes.", "Өргөгч өрөмдлөгийн цооногууд — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Limit ellipsoid or loosening ellipsoid", "Хязгаарын эллипсоид буюу сулралтын эллипсоид", "The approximately ellipsoidal mass of broken ore or rock that will have moved, but not necessarily been discharged, when a bottom outlet is opened or draw occurs. Syomomous with IMZ or IDZ", "Хязгаарын эллипсоид буюу сулралтын эллипсоид — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Limit line", "Хязгаарын шугам", "The line joining the undercut boundary and the surface limit of draw.", "Хязгаарын шугам — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Limit of draw", "Хүдэр буулгалтын хязгаар", "The point on the surface beyond which no movement occurs.", "Хүдэр буулгалтын хязгаар — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Limit of movement", "Хөдөлгөөний хязгаар", "The limit beyond which there is no appreciable or significant movement (i.e. edge of subsidence).", "Хөдөлгөөний хязгаар — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Line of break (cave boundary)", "Эвдрэлийн шугам (нуралтын хил)", "The hypothetical line measured from the edge of the extraction level to the edge of the crater zone.", "Эвдрэлийн шугам (нуралтын хил) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Load", "Ачаалал", "The application of a vertical stress.", "Ачаалал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Local magnitude", "Орон нутгийн магнитуд", "Measure of the strength of a seismic event; based on energy release, source size, and forces acting at the source.", "Орон нутгийн магнитуд — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Long-hole drill", "Урт цооногийн өрөм", "A rotary- or percussive-type drill used to drill underground blastholes to depths exceeding 3 m.", "Урт цооногийн өрөм — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Longitudinal wave (P wave)", "Уртааш долгион (P долгион)", "An elastic wave in which the displacements are in the direction of wave propagation.", "Уртааш долгион (P долгион) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Long ton", "Британийн урт тонн", "2,240 lbs. (compared with a short ton, which is 2,000 lbs.).", "Британийн урт тонн — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Loose ground", "Сул чулуулаг", "As used by miners, rock that must be barred down to make an underground workplace safe; also fragmented or weak rock in which underground openings cannot be held open unless supported.", "Сул чулуулаг — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Magnitude (seismic)", "Сейсмийн магнитуд", "Measure of the size of a seismic event. May encompass energy, moment or both in its calculation. In general a magnitude 3.0 is 33 times as big as a magnitude 2.0.", "Сейсмийн магнитуд — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Major apex", "Үндсэн орой", "The shaped structure or pillar above the extraction level formed between two adjacent drawpoints but separated by the extraction drift.", "Үндсэн орой — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Major principal stress", "Их гол хүчдэл", "The largest (with regard to sign) principal stress.", "Их гол хүчдэл — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Markers", "Тэмдэглэгчид", "Typically referring to items extracted through drawpoints from a know location above or installed within the cave; from which some interpretation of the flow of the caved rock can be deduced.", "Тэмдэглэгчид — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Mass flow", "Массын урсгал", "The mechanism by which a volume of broken ore or rock moves downwards uniformly and vertically during draw.", "Массын урсгал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Mining Rock Mass Rating (MRMR)", "Уул уурхайн чулуулгийн массивын үнэлгээ (MRMR)", "A rock mass classification scheme developed by Dr D H Laubscher for use in mining, including block caving, applications.", "Уул уурхайн чулуулгийн массивын үнэлгээ (MRMR) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Massive rock", "Массив чулуулаг", "Isotropic, homogeneous rock with a strength that does not vary appreciably from point to point. Typical examples are igneous rocks such as granite and diorite; metamorphic rocks such as marble and quartzite; and some thick-bedded sedimentary rocks.", "Массив чулуулаг — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Mesh (screen)", "Торон бэхэлгээ / тор", "A wire skin support element.", "Торон бэхэлгээ / тор — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Microseismic event", "Микросейсмийн үзэгдэл", "A very small seismic event which is normally detectable only by means of sensitive instruments and which is unlikely to cause damage but whose effects may extend into the audible range of 'rock noise' underground.", "Микросейсмийн үзэгдэл — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Microdefects (microfractures)", "Бичил согог (бичил ан цав)", "A series of small fractures that typically weaken the in situ rock strength.", "Бичил согог (бичил ан цав) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Minable reserves", "Олборлох боломжтой нөөц", "Ore reserves that are known to be extractable using a given mining plan.", "Олборлох боломжтой нөөц — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Minimum span", "Хамгийн бага алслалт", "The smallest span required to ensure cave initiation and contiuous caving for any given rock mass; an alternative caveability predicter to the critical hydraulic radius.", "Хамгийн бага алслалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Minor apex", "Дэд орой", "The shaped structure or pillar formed between two adjacent drawbells on the same side of the extraction drift and generally oriented normal to the major apex.", "Дэд орой — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Moisture content", "Чийгийн агууламж", "The percentage moisture content equals the weight of moisture divided by the weight of dry specimen multiplied by 100.", "Чийгийн агууламж — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Movement zone (see Isolated movement zone)", "Хөдөлгөөний бүс (тусгаарлагдсан хөдөлгөөний бүсийг үзнэ үү)", "See Isolated Movement Zone (IMZ).", "Isolated movement zone (IMZ)-ийг үзнэ үү: хүдэр буулгалтын үед хөдөлгөөнд орж буй бутарсан хүдэр, чулуулгийн бүс.", ""], ["Mud rush", "Шаварлаг материалын гэнэтийн урсалт", "A sudden inflow of mud from a drawpoint or other underground opening.", "Шаварлаг материалын гэнэтийн урсалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Muck Pile", "Бутарсан уулын цулын овоолго", "The caved ore within the block cave.", "Бутарсан уулын цулын овоолго — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Narrow flat undercut", "Нарийн хэвтээ доороос тайралт", "A flat undercut whose vertical height is limited to approximately that of the drill drifts, often in the order of 4 m.", "Нарийн хэвтээ доороос тайралт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Narrow inclined undercut", "Нарийн налуу доороос тайралт", "An undercut that is both inclined and narrow.", "Нарийн налуу доороос тайралт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["No Go Area", "Нэвтрэхийг хориглосон бүс", "Area within the restricted zone around the Block Cave crater that must not be accessed by any personnel.", "Нэвтрэхийг хориглосон бүс — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Nomogram", "Номограмм", "A type of line chart that graphically represents an equation of three variables, each of which is represented by a graduated straight line. It is used to avoid lengthy calculations;", "Номограмм — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Normal stress", "Хэвийн хүчдэл", "The stress component at right angles to a given plane.", "Хэвийн хүчдэл — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Offset Herringbone layout", "Зөрүүлсэн ясны нуруу хэлбэрийн зохион байгуулалт", "The most common layout adopted by new generation block caves. In the offset herringbone layout the adjacent drawpoints on either side of the extraction drive are offset. The goal being to reduce the spans between drawpoints inherent in the Herringbone layout.", "Зөрүүлсэн ясны нуруу хэлбэрийн зохион байгуулалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Open hole", "Хамгаалалтгүй цооног", "A borehole free of any obstruction, typically used to measure the position of the cave back and caved muckpile below using a depth sonde.", "Хамгаалалтгүй цооног — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Orebody", "Хүдрийн биет", "A continuous, well-defined mass of material of sufficient ore content to make extraction economically feasible.", "Хүдрийн биет — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Orepass", "Хүдэр буулгах босоо малталт", "A vertical or inclined passage for the downward transfer of ore; equipped with gates or other appliances for controlling the flow. An orepass is driven in ore or country rock and connects a level with a lower level.", "Хүдэр буулгах босоо малталт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Oriented core", "Чиглэл тогтоосон өрөмдлөгийн дээж", "A core specimen that can be positioned on the surface as it was in the borehole prior to extraction. Such a core is necessary for the derivation of the orientations of any structures or contacts, etc.", "Чиглэл тогтоосон өрөмдлөгийн дээж — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Overbreak", "Төслийн хэмжээнээс хэтэрсэн малталт", "The quantity of rock that is removed beyond the planned perimeter of the final excavation.", "Төслийн хэмжээнээс хэтэрсэн малталт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Oversize", "Хэт том ширхэглэл", "Large blocks in a drawpoint that require size reduction (secondary breaking) inorder to effectly move through the ore handling system.", "Хэт том ширхэглэл — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Panel caving", "Панелийн нураалтын арга", "A form of cave mining in which the orebody is undercut and caved progressively in a series of usually parallel panels.", "Панелийн нураалтын арга — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Panel drift", "Панелийн хэвтээ малталт", "An extraction (production) drive in a panel cave.", "Панелийн хэвтээ малталт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Particle Flow Code (PFC)", "Particle Flow Code (PFC) ширхэгийн урсгалын тооцооллын програм", "A numerical analysis code based on Dr P A Cundall’s distinct element method in which the material is represented as an assembly of discrete particles and permitted to flow according to the laws of Newtonian mechanics.", "Particle Flow Code (PFC) ширхэгийн урсгалын тооцооллын програм — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["PCBC (PC Block Cave) PIPO CLOWN BASKET CASE", "PCBC (PC Block Cave) программ", "Is an empirical code for prediction of gravity flow in block caving mines. It is based on understanding developed from sand model experiments, in situ marker trials and back analysis of drawn grades/lithologies from caving operations. The code simulates draw using a series of fixed-radius “draw cones＂defined ahead of time and empirical mixing rules applied to the material within those cones to account for the mixing cause by non-uniform velocity profiles, fines migration and free surface rilling. It is presumed within the code that interactive draw is always achieved, which makes it unsuitable for the analysis of recovery and dilution in cases where fine fragmentation (relative to drawpoint spacing) leads to isolated draw and early waste entry. (Pierce 2009)", "PCBC (PC Block Cave) программ — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Peak Particle Velocity", "Ширхэгийн оргил хурд", "The maximum velocity of the rock mass measured directly at a geophone or calculated from ground motion relations.", "Ширхэгийн оргил хурд — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Percolation", "Шүүрэлт", "The movement of water, under hydrostatic pressure, through the small interstices of rock or soil.", "Шүүрэлт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Permeability", "Нэвчимтгий чанар", "The state in which a material allows the passage of liquid or gas.", "Нэвчимтгий чанар — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Plane stress (or strain)", "Хавтгайн хүчдэл (эсвэл деформаци)", "The state of stress (or strain) within a body in which all the stress (or strain) components normal to a certain plane are zero.", "Хавтгайн хүчдэл (эсвэл деформаци) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Plasticity", "Уян налархай чанар", "(state in which a material continues to deform indefinitely whilst sustaining a constant stress", "Уян налархай чанар — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Plug subsidence (plug caving)", "Бөглөө хэлбэрийн суулт (бөглөө нураалт)", "A form of discontinuous subsidence in which a plug of material overlying an underground opening subsides into the opening suddenly. It is a form of chimney caving that occurs suddenly rather than progressively and is controlled by one or more major structural features which providelow s trength surfaces on which the plug of undercut rock may slide under the influence of gravity. In this case, the rock will undergo essentially rigid body displacement without breaking up or dilating if the vertical distance through which it falls is restricted, Brown11.", "Бөглөө хэлбэрийн суулт (бөглөө нураалт) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Porosity", "Сүвэрхэг чанар", "The ratio of the aggregate volume of voids or interstices in a rock or soil to its total volume.", "Сүвэрхэг чанар — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Post- or conventional undercut", "Дараах буюу уламжлалт доороос тайралт", "An undercutting strategy in which the undercut is mined after the development of the underlying extraction level, including the drawpoints, has been completed.", "Дараах буюу уламжлалт доороос тайралт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Pre-conditioning", "Урьдчилсан сулруулалт", "A process, or well-defined group of processes, implemented before the initiation of caving to alter the inherent characteristics of the target rock mass to enhance its caving and fragmentation characteristics.", "Урьдчилсан сулруулалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Pre-undercut", "Урьдчилсан доороос тайралт", "An undercutting strategy in which the undercut is mined before the development of the underlying extraction level and the drawpoints.", "Урьдчилсан доороос тайралт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Primary fragmentation", "Анхдагч бутрал", "The fragmentation defined by the blocks in the vicinity of the cave back as they separate from the cave back.", "Анхдагч бутрал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Principal stress", "Гол хүчдэл", "The stress normal to one of three mutually perpendicular planes on which the shear stress at the point in the body are zero", "Гол хүчдэл — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Principal strain", "Гол деформаци", "The strain normal to one of three mutually perpendicular planes on which the shear strain at the point in the body are zero", "Гол деформаци — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Production drift", "Үйлдвэрлэлийн хэвтээ малталт", "One of the major set of parallel excavations or drifts on the extraction or production level through which the drawpoint drifts are accessed and ore is transported away from the drawpoints.", "Үйлдвэрлэлийн хэвтээ малталт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Progressive failure", "Аажим даамжрах эвдрэл", "Ongoing failure and movement of rock in the hangingwall (and occasionally in the footwall), as mining proceeds to greater depth.", "Аажим даамжрах эвдрэл — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Pseudo-continuous domain", "Хуурамч тасралтгүй муж", "The rock mass in this region behaves mainly elastically. Rock mass behaviour and properties are those of an undisturbed rock mass.", "Хуурамч тасралтгүй муж — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Pull rate", "Таталтын хурд", "See Draw rate", "Таталтын хурд — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["P-Wave", "P долгион", "See Longitudinal wave", "P долгион — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Q System", "Q систем", "The Q or NGI (Norwegian Geotechnical Institute) classification system developed by Barton, Lien and Lunde in 1974, primarily for tunnel design.", "Q систем — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Rampup rate", "Үйлдвэрлэлийн хүчин чадалд хүрэх өсөлтийн хурд", "The rate at which mine production is increased toward the planned operating capacity.", "Уурхайн олборлолт, үйлдвэрлэлийн хэмжээг төлөвлөсөн хүчин чадалд хүргэх хүртэл нэмэгдүүлэх хурд.", ""], ["REBOP (Rapid Emulator Based On PFC3D)", "REBOP (PFC3D-д суурилсан хурдавчилсан эмулятор)", "A numerical analysis code used to simulate the flow of broken ore or rock in draw columns and through drawpoints. The model was developed by Cundall et al. (2000) based on observations of flow in PFC3D simulations of draw.", "REBOP (PFC3D-д суурилсан хурдавчилсан эмулятор) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Reinforcement", "Чулуулгийн бэхэлгээ / арматурлалт", "A means of improving the overall properties of a rock mass from within the rock mass by techniques such as rock bolting and cable bolting.", "Чулуулгийн бэхэлгээ / арматурлалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Restricted Area", "Хязгаарлагдмал бүс", "An area (usually within the continuous subsidence zone) that has restriced access for reasons of safety.", "Хязгаарлагдмал бүс — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Rilling", "Гадаргын жижиг ховилт элэгдэл", "The downward movment of material along the surface slope of the material pile (the slope of the material is often refferd to as the rill). The non-mining term is used to describe the steep-sided, small channels formed in the land surface, as a result of raid erosion.", "Гадаргын жижиг ховилт элэгдэл — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Risk", "Эрсдэл", "Formally the product of the probability of occurrence of a hazard and the magnitude of the consequences of that occurrence.", "Эрсдэл — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Risk analysis", "Эрсдэлийн шинжилгээ", "A structured process which identifies both the likelihood and the consequences of the hazards arising from a given activity or facility.", "Эрсдэлийн шинжилгээ — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Risk assessment", "Эрсдэлийн үнэлгээ", "The comparison of the results of a risk analysis with risk acceptance criteria or other decision parameters.", "Эрсдэлийн үнэлгээ — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Roadway", "Тээврийн малталт", "Generally, a long excavation used for transportation in an underground mine. In caving mines the term is sometimes used to describe the surface on which vehicles travel on the extraction or production level.", "Тээврийн малталт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Rock", "Чулуулаг", "Any naturally formed aggregate of mineral matter occurring in large masses or fragments.", "Чулуулаг — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Rock block strength (RBS)", "Чулуулгийн блокийн бат бэх (RBS)", "The term developed by Dr Laubscher to desribe the rock mass strength of a block of rock bounded my by block forming discontiuities. This is not the strength of the greater rock mass but rather the strength of a typical primary block that will eventually detatch from the cave back.", "Чулуулгийн блокийн бат бэх (RBS) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Rock burst", "Чулуулгийн цохилт", "The uncontrolled disruption of rock associated with a violent release of energy. A sudden and often violent breaking of a mass of rock from the walls of a tunnel, mine, or deep quarry, caused by failure of highly stressed rock and the rapid or instantaneous release of accumulated strain energy. It may result in closure of a mine opening, or projection of broken rock into it, accompanied by ground tremors, rockfalls, and air concussions.", "Чулуулгийн цохилт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Rock fall (fall of ground)", "Чулуулгийн нуралт", "The fall of a rock fragment or a portion of fractured rock mass without the simultaneous occurrence of a seismic event.", "Чулуулгийн нуралт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Rock mass", "Чулуулгийн массив", "The rock as it occurs in situ, including all its discontinuities.", "Чулуулгийн массив — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Rock mass characterisation", "Чулуулгийн массивын шинж чанарын тодорхойлолт", "The systematic process of describing a rock mass both quantitatively and qualitatively for engineering purposes.", "Чулуулгийн массивын шинж чанарын тодорхойлолт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Rock mass classification", "Чулуулгийн массивын ангилал", "The method of assigning numerical values to a range of characteristics considered likely to influence the engineering behaviour of a rock mass and of combining these values into one overall numerical rating.", "Чулуулгийн массивын ангилал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Rock Mass Rating (RMR)", "Чулуулгийн массивын үнэлгээ (RMR)", "A rock mass classification scheme on a scale of 0-100 developed by Dr Z T Bieniawski.", "Чулуулгийн массивын үнэлгээ (RMR) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Rock mass strength (RMS)", "Чулуулгийн массивын бат бэх (RMS)", "The strength of the rock mass (MPa), i.e. the in situ rock strength reduced by the influence of the inherent joints and their joint condition.", "Чулуулгийн массивын бат бэх (RMS) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Rock mechanics", "Чулуулгийн механик", "The theoretical and applied science of the mechanical behaviour of rock", "Чулуулгийн механик — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["S-wave (secondary wave or shear wave)", "S долгион (хоёрдогч буюу хөндлөн долгион)", "A type of seismic wave,which is one of the two main types of elastic body waves, so named because they move through the body of an object, unlike surface waves. These waves carry energy through the rock mass in very complex patterns of transverse (crosswise) waves. These waves move more slowly than P waves, but in an earthquake they are usually bigger.", "S долгион (хоёрдогч буюу хөндлөн долгион) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Secondary breaking", "Хоёрдогч бутлалт", "The additional breaking of caved or broken ore or rock by mechanical means or by explosives to reduce large fragments to the sizes required for loading and transportation. Secondary breaking may be required to treat hangups.", "Хоёрдогч бутлалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Secondary fragmentation", "Хоёрдогч бутрал", "The fragmentation produced in caved ore or rock during residence in the ore column and draw.", "Хоёрдогч бутрал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Seismic event", "Сейсмийн үзэгдэл", "Transient earth motion caused by a sudden release of the strain energy stored in rock.", "Сейсмийн үзэгдэл — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Seismogenic zone", "Сейсмоген бүс", "Microseismic activity occurs in this region primarily due to discontinuity damage and the initiation of new fractures. The overall advance rate, thickness and spatial distribution of the seismogenic zone within the numerical model of caving has been determined by the criterion in Equation (1) (after Diederichs, 1999).", "Сейсмоген бүс — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Sequence (draw)", "Хүдэр буулгалтын дараалал", "The sequence in which the drawpoints are drawn in the draw schedule.", "Хүдэр буулгалтын дараалал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Sets", "Рам хэлбэрийн ган бэхэлгээ", "Steel assemblies used to support mine workings.", "Рам хэлбэрийн ган бэхэлгээ — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Shape factor", "Хэлбэрийн коэффициент", "The ratio of the area to the perimeter of an excavated surface, .i.e. the hydraulic radius.", "Хэлбэрийн коэффициент — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Slusher", "Скрепер төхөөрөмж", "A mechanically operated, chain pulled scraper which moves caved or broken ore from a row of drawpoints to a grizzly or ore pass.", "Скрепер төхөөрөмж — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Span", "Алслалт", "Spallinglongitudinal splitting in uniaxial compression, or the breaking-off of plate-like pieces from a free rock surface.", "Алслалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Spitting", "Чулуулгийн хэлтэрхий шидэгдэн гарах үзэгдэл", "The violent ejection of splinters of rock from the surface of an excavation", "Чулуулгийн хэлтэрхий шидэгдэн гарах үзэгдэл — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Stacking", "Овоолон хуримтлуулах", "The collection or stacking of caved or broken ore or rock on the undercut level or on the major apices.", "Овоолон хуримтлуулах — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Stagnant Zone", "Зогсонги бүс", "The stationary caved material between the movement zone (IMZs) that is not influenced by draw.", "Зогсонги бүс — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Stiffness", "Хөшүүн чанар", "Stiffness is the resistance of an elastic body to deformation by an applied force. It is an extensive material property and a measure of rigidity. The stiffness of a system with respect to a deformation is the second derivative of the energy with respect to the corresponding displacement; this measures the curvature of the potential energy surface along a particular direction.", "Хөшүүн чанар — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Strain burst", "Деформацийн цохилт", "(rockburst at the lower end of the spectrum of violent events occurring essentially at the surface of an excavation)", "Деформацийн цохилт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Strength", "Бат бэх", "The maximum stress that a material can resist without failing for any given load regime.", "Бат бэх — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Stress caving", "Хүчдэлийн нөлөөгөөр нурах", "A caving mechanism in which the in situ rock fractures and caves under the influence of the stresses induced in the cave back.", "Хүчдэлийн нөлөөгөөр нурах — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Stress relaxation (stress relief)", "Хүчдэлийн сулралт (хүчдэл тайлагдах)", "Stress release due to creep or constant strain.", "Хүчдэлийн сулралт (хүчдэл тайлагдах) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Sublevel Caving (SLC)", "Дэд түвшний нураалтын арга", "A stoping method in which relatively thin blocks of ore are caused to cave by successively undermining small panels. The ore deposit is developed by a series of sublevels spaced at vertical intervals. Usually only one or two sublevels are developed at a time, beginning at the top of the orebody. This method is intermediate between block caving and top slicing, since part of the ore is mined as in top slicing and part is caved. The method is applicable to irregular and steeply dipping orebodies that cannot be worked by top slicing.", "Дэд түвшний нураалтын арга — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Surface Subsidence", "Газрын гадаргын суулт", "The lowering of the ground surface following underground mining.", "Газрын гадаргын суулт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Subsidence angle", "Суултын өнцөг", "The angle measured from the horizontal to the limit of movement (i.e. edge of the stable zone or edge of subsidence).", "Суултын өнцөг — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Subsidence caving", "Суултаас үүдэлтэй нуралт", "A caving mechanism in which a large mass of rock subsides rapidly as a result of shear failure on the vertical or near-vertical boundaries of a block.", "Суултаас үүдэлтэй нуралт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Subsidence Zone", "Суултын бүс", "The area which encompasses all caving induced deformations on the surface. By definition this includes the caved rock zone, fractured zone and continuous subsidence zone.", "Суултын бүс — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Support", "Бэхэлгээ", "The application of a reactive force to the surface of an excavation to control the deformation of the rock mass. Sometimes support is taken to include reinforcement as defined above.", "Бэхэлгээ — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Surface subsidence", "Газрын гадаргын суулт", "The lowering of the ground surface following underground mining.", "Газрын гадаргын суулт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["S-Wave (shear wave, secondary wave)", "S долгион (хөндлөн, хоёрдогч долгион)", "Secondary seismic waves. A seismic wave with a direction of vibration that is perpendicular to the direction of travel. S-waves are slower than P-waves and travel only through solids.", "S долгион (хөндлөн, хоёрдогч долгион) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Swell Factor", "Эзлэхүүний тэлэлтийн коэффициент", "Ratio of the volume of broken rock over original volume", "Эзлэхүүний тэлэлтийн коэффициент — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Swelling (Bulking)", "Эзлэхүүний тэлэлт (булкинг)", "The increase in volume of a mass of rock when it has caved or been otherwise broken and removed from its in situ state.", "Эзлэхүүний тэлэлт (булкинг) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Tensile stress", "Суналтын хүчдэл", "(normal stress tending to lengthen a body along the direction in which it acts)", "Суналтын хүчдэл — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Tension cracks", "Суналтын ан цав", "An extension fracture caused by tensile stress. These fractures form and propagate perpendicularly to the direction of maximum extension. Tension fractures often occur in en échelon arrangements.", "Суналтын ан цав — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Transition zone", "Шилжилтийн бүс", "Area on the ground surface between the zone of significant movement and limit of surface movement. The transition zone may be broken into two sections: stable and unstable. In competent rock, the unstable section is very small or non-existent. The stable section may show no sign of vertical movement.", "Шилжилтийн бүс — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Triaxial compression", "Гурван тэнхлэгийн шахалт", "(compression caused by the application of normal stress in three perpendicualr directions", "Гурван тэнхлэгийн шахалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Unconfined", "Хязгаарлалтгүй", "Not confined, sigma3 = 0", "Хязгаарлалтгүй — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Undercut", "Доороос тайралт", "The approximately horizontal slot mined to initiate caving of a block or panel.", "Доороос тайралт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Undercut Advance rate (or Undercutting rate)", "Доороос тайралтын ахилтын хурд", "The rate, expressed as an area per unit time (e.g. m2 per month), at which the undercut front is advanced. It is also sometimes expressed as the distance the undercut is moved within each undercut tunnel per unit time (e.g. m or rings per month).", "Доороос тайралтын ахилтын хурд — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Undercut drive (drift/tunnel)", "Доороос тайралтын малталт (хэвтээ малталт/туннель)", "The tunnels on the undercut level from which the undercut rings are drilled, charged and blasted.", "Доороос тайралтын малталт (хэвтээ малталт/туннель) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Undercut face", "Доороос тайралтын мөргөцөг", "The position of the blasted undercut rings at any given time can be connected across all undercut tunnels on a mine plan. This line (polygon) is referred to as the undercut face position at that that particular time.", "Доороос тайралтын мөргөцөг — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Undercut level", "Доороос тайралтын түвшин", "The level of the bottom of the undercut from which the mining of the undercut takes place.", "Доороос тайралтын түвшин — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Unstable fracture angle", "Тогтворгүй ан цавын өнцөг", "The angle beyond which the rock mass behaviour changes from ‘partially stable’ to unstable. Subsidence Area = Zone of Movement Transition Zone Stable Zone Partially stable Zone Unstable Zone Crater = Breakthrough Zone = Devastation Zone Partially Stable Zone stable A B C Zone Deformed Stable Unstable A&B Edge of Subsidence area fractured fractured area area Tension cracks Sli din gP Lin lan Failu e of e re Z Bre As defined by: ak = one Line of Br = Cave An Kvapil = Zo Sub side Hoek et al ne o eak = Cave gle = Brea nce f Lim Singh et al line ited Laubscher et al k Plane Disp Boundary C = Cave Angle = Angle of Break = Break Angle Zone of Active lac B = Unstable Fracture Angle Cave Movement eme A = Fracture Initiation Angle (Caved material) = Backbr nts D = Deformation Angle = Angle of Subsidence eak C Extraction level", "Тогтворгүй ан цавын өнцөг — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Verandah", "Тавцан маягийн ирмэг", "A bench-like or platform-shaped horizontal extension associated with an underground excavation.", "Малталтын орчимд үүсэх тавцан маягийн хэвтээ өргөтгөл буюу ирмэг хэсэг.", ""], ["Virgin stress", "Анхны хүчдэлийн төлөв", "state of stress in a geological formation before it is disturbed by man-made operations.", "Анхны хүчдэлийн төлөв — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Void diffusion", "Хөндийн тархалт", "A mechanism of the irregular flow and intermixing of ore or rock from adjacent draw zones which involves the upwards migration, filling and/or collapse of voids formed by large, angular particles.", "Хөндийн тархалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Weathering", "Өгөршил", "process of disintegration and decompostion as a consequence of exposure to the atmosphere, to chemical action, and to the acion of frost, water, and heat.", "Өгөршил — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Weighting (see Loading)", "Жинлэлт (Loading-ийг үзнэ үү)", "See Loading; the assignment of a weighting or relative importance to a parameter or input.", "Loading буюу ачааллын нэр томьёог үзнэ үү; тооцоонд үзүүлэлтүүдэд жин буюу ач холбогдлын коэффициент олгохыг хэлнэ.", ""], ["Wet muck flow", "Чийгтэй бутарсан материалын урсгал", "The sudden collapse and rapid run-out of wet granular material, usually from a drawpoint.", "Чийгтэй бутарсан материалын урсгал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Yield stress (strength)", "Урсалтын хүчдэл (бат бэх)", "Stress beyond which the induced deformation is not fully annulled after complete destressing. Materials Engineers define The Yield Strength of a material as that stress at which a predetermined amount of permanent deformation (often 0.2%) takes place, see Fig Y.1 below.", "Урсалтын хүчдэл (бат бэх) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Yielded Zone", "Урсалт/хуванцаржилт үүссэн бүс", "This region describes rock mass that has lost some or all of its cohesion and provides minimal support to the overlying rock mass. Within the conceptual model of caving, Duplancic and Brady (1999) refer to this zone as the zone of discontinuous deformation or Zone of Loosening. The numerical definition of the yield zone includes zones that have degraded to zero cohesion or tensile strength. This criterion was established by ITASCA though a back-analysis of the Northparkes E26 Lift 2 cave and has been validated at the Palabora mine.", "Урсалт/хуванцаржилт үүссэн бүс — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Zone of active movement", "Идэвхтэй шилжилтийн бүс", "Area of broken and caved rock over the mined stope, it may also be referred to as the destruction zone or crater. To some extent the definition will depend upon the tolerance of the surface features and structures to damage.", "Идэвхтэй шилжилтийн бүс — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Zone of discontinuous deformation", "Тасалдсан деформацийн бүс", "Refer to Yielded Zone", "Тасалдсан деформацийн бүс — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Zone of influence", "Нөлөөллийн бүс", "Generally, the zone surrounding an excavation in which the pre-existing stresses are perturbed by a given amount (often taken as 5%) by the presence of the excavation. In block caving, the term is also used to describe the zone surrounding the cave in which the rock mass response is influenced by the presence of the cave.", "Нөлөөллийн бүс — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Zone of loosening", "Сулралтын бүс", "Refer to Yielded Zone", "Сулралтын бүс — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""]]</script>
<script>
(async () => {
const el = id => document.getElementById(id);
// Set your project's URL and publishable key. Keep service-role keys off the site.
const SUPABASE_URL = 'https://urmnvxuuzbrtxebcszkq.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_mHIuH7Xqj5kHtdpr0179qw__Ehle5kY';
const sourceStatus = el('data-source-status');
const seed = JSON.parse(el('seed-terms').textContent);
const fields = ['english','mongolian','english_definition','mongolian_definition','image_url'];
let database = null, isAdmin = false, editing = null;
async function loadGlossary() {
  try {
    const source = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQzzKTwRYU8uWvuANW0d7s-I5xK4uwF0QhwJIiQlCWGYZX0MbkLXvOTQ6yfJdzPmT38ykXIFpWIK36R/pub?gid=129970236&single=true&output=csv";
    const response = await fetch(source, {cache: 'no-cache'});
    if (!response.ok) throw new Error('Эх үүсвэр HTTP ' + response.status + ' хариу өглөө.');
    const csv = (await response.text()).replace(/^\uFEFF/, '');
    const rows = [];
    let row = [], field = '', quoted = false;
    const separator = csv.split(/\r?\n/, 1)[0].includes(';') ? ';' : ',';
    for (let i = 0; i < csv.length; i++) {
      const char = csv[i];
      if (char === '"' && (quoted || !field)) {
        if (quoted && csv[i + 1] === '"') { field += '"'; i++; }
        else quoted = !quoted;
      } else if (!quoted && (char === separator || char === '\n' || char === '\r')) {
        row.push(field);
        field = '';
        if (char !== separator) {
          rows.push(row);
          row = [];
          if (char === '\r' && csv[i + 1] === '\n') i++;
        }
      } else field += char;
    }
    if (quoted) throw new Error('CSV файл бүрэн уншигдсангүй.');
    if (row.length || field) rows.push([...row, field]);
    const header = rows.findIndex(row => row[0]?.trim().toLowerCase().replace(/\s+/g,' ') === 'english term');
    if (header < 0) throw new Error('English Term баганын гарчиг олдсонгүй.');
    const entries = rows.slice(header+1).filter(row => row[0]?.trim());
    if (!entries.length) throw new Error('Нэр томьёоны мөр олдсонгүй.');
    sourceStatus.textContent = 'Google Sheets · ' + entries.length + ' нэр томьёо уншлаа.';
    return entries.map(row => Array.from({length:5},(_,i)=>(row[i]||'').trim()));
  } catch (error) {
    const detail = error instanceof TypeError ? 'Холбоос болон нийтлэх эрхийг шалгана уу.' : error.message;
    sourceStatus.textContent = 'Google Sheets' + ' уншигдсангүй. ' + detail + '';
    return null;
  }
}

const getSheetKey = row => JSON.stringify(row.slice(0,2));
const sheetTerms = await loadGlossary();
let terms = (sheetTerms || seed).map(row => [...row,null,getSheetKey(row)]);
if (!sheetTerms) sourceStatus.textContent += ' Файлд багтсан 379 нэр томьёог харуулж байна.';

if (SUPABASE_URL && SUPABASE_PUBLISHABLE_KEY) {
  try {
    const {createClient} = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    database = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const remote = [];
    for (let offset = 0; ; offset += 500) {
      const {data,error} = await database.from('glossary_terms').select('id,source_key,'+fields.join(',')).order('id').range(offset,offset+499);
      if(error) throw error;
      remote.push(...data.map(entry => [...fields.map(field => entry[field] ?? ''),entry.id,entry.source_key]));
      if(data.length < 500) break;
    }
    const editedKeys = new Set(remote.map(row=>row[6]).filter(Boolean));
    terms = [...terms.filter(row=>!editedKeys.has(row[6])), ...remote];
    sourceStatus.textContent = 'Нийт '+terms.length+' нэр томьёо · '+(sheetTerms?'Google Sheets':'Файлд багтсан жагсаалт')+' + админы засвар';

  } catch {
    sourceStatus.textContent = 'Онлайн санг уншиж чадсангүй. Файлд багтсан жагсаалтыг харуулж байна.';
  }
}
const makeId = row => JSON.stringify(row.slice(0, 2));
const letters = [...new Set(terms.map(row => row[0][0]?.toUpperCase()).filter(c => /^[A-Z]$/.test(c)))].sort();
let stored = [];
try { stored = JSON.parse(localStorage.getItem('cavelex-saved') || '[]'); } catch {}
const favorites = new Set(Array.isArray(stored) ? stored.filter(id => typeof id === 'string') : []);
const nodes = {};
let onlySaved = false, initial = '', page = 0;
const pageSize = 12;
const normalize = text => text.normalize('NFKC').toLocaleLowerCase();
const records = terms.map(row => ({row, id: makeId(row), haystack: normalize(row.join(' '))}));
function make(tag, content){const node = document.createElement(tag); if(content !== undefined) node.textContent=content; return node;}
function termCard({row, id}){
 const [en,mn,enDefinition,mnDefinition,imageUrl]=row;
 const card=make('article'); card.className='term';
 const head=make('header'), name=make('h3',en), star=make('button',favorites.has(id)?'★':'☆');
 if(mn) name.append(make('span',mn));
 star.setAttribute('aria-pressed',favorites.has(id)); star.setAttribute('aria-label','Хадгалах · '+en);
 star.onclick=()=>{
   if(favorites.has(id)) favorites.delete(id); else favorites.add(id);
   try{localStorage.setItem('cavelex-saved',JSON.stringify([...favorites]));}catch{}
   if(onlySaved) render(); else {
     star.textContent=favorites.has(id)?'★':'☆';
     star.setAttribute('aria-pressed',favorites.has(id));
     el('countSaved').textContent=favorites.size;
   }
 };
 const actions=make('div'); actions.className='admin-card-actions';
 actions.append(star);
 if(isAdmin){
   const edit=make('button','Засах');
   edit.type='button';edit.onclick=()=>openAdmin(row);actions.append(edit);
 }
 head.append(name,actions); card.append(head);
 if(enDefinition || mnDefinition){
   const details=make('details'); details.append(make('summary','Тодорхойлолт'));
   if(mnDefinition){const p=make('p',mnDefinition);p.lang='mn'; details.append(p);}
   if(enDefinition){const p=make('p',enDefinition);p.lang='en'; details.append(p);}
   const imageName = en.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
   if (imageName) {
     details.addEventListener('toggle', () => {
       if (!details.open || details.dataset.imageChecked) return;
       details.dataset.imageChecked = 'true';
       const imageSources = ['webp', 'png', 'jpg', 'jpeg'].map(ext => './images/' + imageName + '.' + ext);
       if (/^(https:\/\/|(?:\.\/)?images\/)/i.test(imageUrl || '')) imageSources.unshift(imageUrl);
       const picture = make('img');
       picture.className = 'definition-image';
       picture.alt = (mn || en) + ' — зураг';
       picture.decoding = 'async';
       const loadNext = () => {
         const source = imageSources.shift();
         if (source) picture.src = source;
       };
       picture.onerror = loadNext;
       picture.onload = () => details.append(picture);
       loadNext();
     });
   }
   card.append(details);
 }
 return card;
}
function render(){
 const words=normalize(el('search').value.trim()).split(/\s+/).filter(Boolean);
 const sortMn=el('sort').value==='mn';
 const matches=records.filter(({row,id,haystack})=>(!onlySaved || favorites.has(id)) && (!initial || row[0][0]?.toUpperCase()===initial) && words.every(word=>haystack.includes(word)));
 matches.sort((a,b)=>a.row[Number(sortMn)].localeCompare(b.row[Number(sortMn)],sortMn?'mn':'en'));
 const pages=Math.max(1,Math.ceil(matches.length/pageSize));
 page=Math.min(page,pages-1);
 el('results').replaceChildren(...matches.slice(page*pageSize,(page+1)*pageSize).map(termCard));
 el('status').textContent=matches.length?matches.length+' нэр томьёо олдлоо':onlySaved && !favorites.size?'Од дээр дарж нэр томьёо хадгална.':'Хайлтад тохирох нэр томьёо олдсонгүй.';
 el('countSaved').textContent=favorites.size;
 el('position').textContent=(page+1)+' / '+pages; el('pager').style.display=pages>1?'flex':'none';
 el('prev').disabled=page===0; el('next').disabled=page+1>=pages;
 for(const key of Object.keys(nodes)) nodes[key].setAttribute('aria-pressed',key===initial);
}
for(const letter of ['',...letters]){const button=make('button',letter||'Бүгд');button.onclick=()=>{initial=letter;page=0;render();};nodes[letter]=button;el('letters').append(button);}
function switchView(saved){onlySaved=saved;initial='';page=0;el('search').value='';el('all').setAttribute('aria-pressed',!saved);el('saved').setAttribute('aria-pressed',saved);el('heading').textContent=saved?'Хадгалсан нэр томьёо':'Нэр томьёо';render();}
el('all').onclick=()=>switchView(false);el('saved').onclick=()=>switchView(true);
el('search').oninput=el('sort').onchange=()=>{page=0;render();};
el('reset').onclick=()=>{el('search').value='';el('sort').value='en';initial='';page=0;render();};
el('prev').onclick=()=>{page--;render();el('status').scrollIntoView({block:'center'});};
el('next').onclick=()=>{page++;render();el('status').scrollIntoView({block:'center'});};
el('total').textContent=terms.length;el('initials').textContent=letters.length;render();

const toolsPanel=el('learning'), today=el('daily'), quiz=el('quiz');
const themeKey='cavelex-theme', learnedKey='cavelex-learned';
function loadLocal(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback;}catch{return fallback;}}
function saveLocal(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch{}}
const learned=new Set(loadLocal(learnedKey,[]).filter(id => typeof id === 'string'));
const date=new Date();
const day=Math.floor(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/86400000);
if (records.length) today.append(termCard(records[day%records.length]));
function setTheme(light){document.documentElement.classList.toggle('light',light);el('theme').setAttribute('aria-pressed',light);el('theme').textContent=light?'☾ Бараан':'☀ Цайвар';saveLocal(themeKey,light);}
setTheme(loadLocal(themeKey,false));
el('theme').onclick=()=>setTheme(!document.documentElement.classList.contains('light'));
let current=-1;
function randomRecord(){const remaining=records.filter(record=>record.id!==current&&!learned.has(record.id));return (remaining.length?remaining:records)[Math.floor(Math.random()*(remaining.length||records.length))];}
function showQuiz(){
 if (!records.length) return;
 const record=randomRecord();current=record.id;
 el('progress').textContent=learned.size+' / '+terms.length+' сурсан';
 el('study-progress').value=learned.size;
 quiz.replaceChildren(make('h3',record.row[0]));
 const reveal=make('button','Хариуг харах');
 reveal.onclick=()=>{
  quiz.replaceChildren(termCard(record));
  const known=make('button',learned.has(current)?'✓ Сурсан':'Сурсан гэж тэмдэглэх');
  known.disabled=learned.has(current);
  known.onclick=()=>{learned.add(record.id);saveLocal(learnedKey,[...learned]);showQuiz();};
  quiz.append(known);
 };
 quiz.append(reveal);
}
el('study-progress').max=terms.length;
el('next-quiz').onclick=showQuiz;
el('random').onclick=()=>{
 const record=records[Math.floor(Math.random()*records.length)];
 switchView(false); el('search').value=record.row[0]; render();
 el('dictionary').scrollIntoView({behavior:'smooth'});
};
el('random').disabled = el('next-quiz').disabled = !records.length;
showQuiz();

const login=el('admin-login'), editor=el('admin-editor'), adminForm=el('admin-form');
const adminStatus=el('admin-status'), dialog=el('admin-dialog');
function openAdmin(row=null){
  editing=row?{id:row[5],sourceKey:row[6]}:null;
  adminForm.reset();
  if(row)fields.forEach((field,i)=>{adminForm.elements.namedItem(field).value=row[i]||'';});
  adminStatus.textContent=!database?'Админ хэсгийг идэвхжүүлэхийн тулд өгөгдлийн санг холбоно.':isAdmin?(row?'Нэр томьёо засах':'Шинэ нэр томьёо нэмэх'):'';
  if(!dialog.open)dialog.showModal();
}
el('admin-open').onclick=()=>openAdmin();
el('admin-close').onclick=()=>dialog.close();
el('admin-new').onclick=()=>openAdmin();
if(database){
  async function applySession(session){
    let allowed=false;
    if(session){
      const {data,error}=await database.rpc('is_glossary_admin');
      allowed=!error && data===true;
    }
    isAdmin=allowed;
    login.hidden=allowed;
    editor.hidden=!allowed;
    if(session && !allowed)adminStatus.textContent='Энэ бүртгэлд засварлах эрх олгогдоогүй байна.';
    render();showQuiz();
  }
  const {data:{session}}=await database.auth.getSession();
  await applySession(session);
  database.auth.onAuthStateChange((_event,session)=>setTimeout(()=>applySession(session),0));
  login.onsubmit=async event=>{
    event.preventDefault();
    const password=el('admin-password');
    if(!password.value){adminStatus.textContent='Нууц үгээ оруулна уу.';password.focus();return;}
    const button=login.querySelector('button[type="submit"]');
    button.disabled=true;
    try{
      const {data,error}=await database.auth.signInWithPassword({email:el('admin-email').value.trim(),password:password.value});
      if(error){
        adminStatus.textContent=error.status===429?'Олон оролдлого хийсэн байна. Түр хүлээгээд дахин оролдоно уу.':'Мэйл эсвэл нууц үгээ шалгана уу.';
      }else{
        password.value='';
        await applySession(data.session);
        if(isAdmin)adminStatus.textContent='Админаар нэвтэрлээ.';
      }
    }catch{adminStatus.textContent='Нэвтрэх хүсэлт амжилтгүй боллоо.';}
    finally{button.disabled=false;}
  };
  el('admin-email-link').onclick=async ()=>{
    const email=el('admin-email');
    if(!email.reportValidity())return;
    const button=el('admin-email-link');
    button.disabled=true;
    try{
      const redirect='https://buyankhishig-pixel.github.io/Block_cave/index.html';
      const {error}=await database.auth.signInWithOtp({email:el('admin-email').value.trim(),options:{shouldCreateUser:false,emailRedirectTo:redirect}});
      if (!error) {
        adminStatus.textContent='Ирсэн мэйл дэх хамгийн шинэ нэвтрэх холбоосыг нээнэ үү.';
      } else if(error.status===429 || error.code?.startsWith('over_')) {
        adminStatus.textContent='Түр хязгаарлалт үйлчилж байна. Хэсэг хүлээгээд нэг удаа дахин оролдоно уу. ('+(error.code||'HTTP 429')+')';
      } else {
        adminStatus.textContent='Холбоос илгээж чадсангүй. Supabase: '+(error.code||error.status||error.message||'Тодорхойгүй алдаа')+'.';
      }
    }catch{adminStatus.textContent='Нэвтрэх хүсэлт амжилтгүй боллоо.';}
    finally{button.disabled=false;}
  };
  el('admin-password-form').onsubmit=async event=>{
    event.preventDefault();
    if(!isAdmin)return;
    const form=event.currentTarget, button=form.querySelector('button');
    const password=el('admin-new-password');
    button.disabled=true;
    try{
      const {error}=await database.auth.updateUser({password:password.value});
      if(error)throw error;
      form.reset();
      adminStatus.textContent='Нууц үг хадгалагдлаа. Дараагийн удаа мэйл + нууц үгээр нэвтэрнэ.';
    }catch(error){
      adminStatus.textContent='Нууц үг хадгалагдсангүй. '+(error.code||'Дахин нэвтэрч оролдоно уу.');
    }finally{button.disabled=false;}
  };
  el('admin-logout').onclick=async ()=>{
    const {error}=await database.auth.signOut();
    if(error)adminStatus.textContent='Гарч чадсангүй.';
    else await applySession(null);
  };
  adminForm.onsubmit=async event=>{
    event.preventDefault();
    if(!isAdmin)return;
    const values=Object.fromEntries(fields.map(field=>[field,adminForm.elements.namedItem(field).value.trim()]));
    if(!values.english){adminStatus.textContent='Англи нэрээ бичнэ үү.';return;}
    if(values.image_url && !/^(https:\/\/|(?:\.\/)?images\/)/i.test(values.image_url)){
      adminStatus.textContent='Зурагт https:// эсвэл images/ холбоос оруулна уу.';return;
    }
    const save=el('admin-save');
    save.disabled=true;
    try{
      const entries=database.from('glossary_terms');
      const request=editing?.id!=null
        ? entries.update(values).eq('id',editing.id)
        : editing?.sourceKey
          ? entries.upsert({...values,source_key:editing.sourceKey},{onConflict:'source_key'})
          : entries.insert(values);
      const {error}=await request.select('id').single();
      if(error)throw error;
      location.reload();
    }catch{adminStatus.textContent='Хадгалж чадсангүй. Холболт, засварлах эрхээ шалгана уу.';}
    finally{save.disabled=false;}
  };
}
})();
</script></body></html>
