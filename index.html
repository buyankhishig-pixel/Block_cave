<script type="application/json" id="seed-terms">[["Abrasion", "Үрэлт элэгдэл", "The mechanical wearing away of rock surfaces by friction and impact of rock particles transported by wind, ice, waves, running water, or gravity.", "Салхи, мөс, долгион, урсгал ус, таталцлын нөлөөгөөр зөөгдсөн чулуулгийн хэсгүүд үрэлт ба цохилтоор чулуулгийн гадаргыг механикаар элээх үйл явц.", ""], ["Abrasion hardness", "Үрэлт элэгдлийн хатуулаг", "Hardness expressed in quantitative terms or numbers indicating the degree to which a substance resists being worn away by frictional contact with an abrasive material, such as silica or carborundum grits. Also called abrasion resistance; wear resistance.", "Зүлгүүрийн материалаар үрэхэд бодис элэгдэхийг эсэргүүцэх чадварыг тоон утгаар илэрхийлсэн үзүүлэлт; элэгдэлд тэсвэрлэх чанар.", ""], ["Abrasive", "Зүлгүүрийн материал", "Any natural or artificial substance suitable for grinding, polishing, cutting, or scouring. Natural abrasives include diamond, emery, garnet, silica sand, diatomite, and pumice; manufactured abrasives include esp., silicon carbide, fused alumina, and boron nitride.", "Нунтаглах, өнгөлөх, огтлох, зүлгэхэд ашиглаж болох байгалийн буюу хиймэл материал.", ""], ["Abutment or Abutment Zone", "Тулгуур буюу тулгуурын бүс", "The outer perimeter rock mass surrounding the cave that is characterised by elevated vertical stress levels (abutment stresses); The end supports of a pressure arch.", "Нуралтыг хүрээлж, өндөр босоо хүчдэлээр тодорхойлогдох чулуулгийн массивын гаднах хэсэг; даралтын нумын төгсгөлийн тулгуур.", ""], ["Abutment stress", "Тулгуурын хүчдэл", "The weight of the overlying rock transferred over the cave onto the rock mass ahead of the cave front (i.e. the cave abutment); The weight of rock above an excavation that has been transferred to the adjoining walls. (Pryor, 3", "Нуралтын фронтын урд талын чулуулгийн массив руу дээрх чулуулгийн жинг шилжүүлснээс үүсэх хүчдэл; малталтын дээрх ачаалал ханын чулуулгад шилжих үеийн хүчдэл.", ""], ["Accelerometer", "Хурдатгал хэмжигч", "A seismometer with response linearly proportional to the acceleration of earth materials with which it is in contact.(AGI) A seismic transducer that produces an electric signal proportional to ground acceleration. (SiM)", "Газрын материалын хурдатгалтай пропорциональ дохио гаргадаг сейсмийн хэмжүүр/хувиргагч.", ""], ["Advance or Advanced Undercut", "Урагш ахисан доороос тайралт", "An undercutting strategy in which the undercut mining face is advanced slightly ahead of a partially developed extraction level.", "Хэсэгчлэн бэлтгэгдсэн олборлолтын түвшнээс бага зэрэг түрүүлж доороос тайралтын мөргөцгийг ахиулдаг тайралтын стратеги.", ""], ["Advance rate", "Ахилтын хурд", "The linear distance (in feet or meters) driven during a certain time in tunneling, drifting, or in raising or sinking a shaft. (Fraenkel)", "Тодорхой хугацаанд хонгил, хэвтээ малталт, босоо малталтын ахиж нэвтэрсэн шугаман зай.", ""], ["Air blast", "Агаарын цохилт", "The rapid flow of air through an underground opening following compression of the air in a confined space. A disturbance in underground workings accompanied by a strong rush of air. The rush of air, at times explosive in force, is caused by the ejection of air from large underground openings, the sudden fall of large masses of rock, the collapse of pillars, slippage along a fault, or a strong current of air pushed outward from the source of an explosion. (Long)", "Хаалттай орон зайд шахагдсан агаар сулран газар доорх малталтаар огцом урсах үзэгдэл; чулуулгийн их хэмжээний нуралт, цулын эвдрэл, хагарлын шилжилт зэрэг шалтгаантай байж болно.", ""], ["Air gap", "Агаарын завсар", "The clear vertical distance between the top of a pile of caved ore and the in situ cave back. Synonymous with the term ‘expansion void’.", "Нурсан хүдрийн овоолгын дээд гадарга ба in situ нуралтын дээд гадаргын хоорондох цэвэр босоо зай; expansion void-той ижил утгатай.", ""], ["Alteration", "Хувирал", "Any change in the mineralogic composition of a rock brought about by physical or chemical means, esp. by the action of hydrothermal solutions (AGI)", "Ялангуяа гидротермаль уусмалын үйлчлэлээр чулуулгийн эрдсийн бүрэлдэхүүн физик, химийн аргаар өөрчлөгдөх үзэгдэл.", ""], ["Angle of break (angle of subsidence, cave angle)", "Нуралтын өнцөг (суултын өнцөг, нуралтын өнцөг)", "The angle made by the cave boundary (line of break), usually by its intersection with the surface, and the horizontal (refer to figure Figure 1 ).", "Нуралтын хил буюу эвдрэлийн шугам хэвтээ хавтгайтай үүсгэх өнцөг.", ""], ["Angle of draw", "Бууралтын өнцөг", "The complement of the angle of break, ie the angle made by the cave boundary with the vertical.", "Нуралтын өнцгийн гүйцээх өнцөг бөгөөд нуралтын хил босоо чиглэлтэй үүсгэх өнцөг.", ""], ["Angle of friction", "Үрэлтийн өнцөг", "The angle between the perpendicular to a surface and the resultant force acting on a body resting on the surface, at which the body begins to slide. (Hammond)", "Гадаргад перпендикуляр чиглэл ба биед үйлчлэх нийлбэр хүчний хоорондох, гулсалт эхлэх үеийн өнцөг.", ""], ["Angle of repose", "Асгаралтын өнцөг", "The maximum angle with respect to a horizontal plane assumed by the surface of a pile of loose material.", "Сул асгармал материалын гадарга хэвтээ хавтгайтай үүсгэх хамгийн их өнцөг.", ""], ["Angle of shear", "Шилжилтийн өнцөг", "The angle between the planes of maximum shear, which is bisected by the axis of greatest compression. (Rice)", "Хамгийн их шилжилтийн хавтгайнуудын хоорондын өнцөг; их шахалтын тэнхлэгээр хуваагдана.", ""], ["Angle of subsidence (Deformation angle)", "Суултын өнцөг (деформацийн өнцөг)", "The angle measured from the horizontal to the limit of movement (i.e. edge of the stable zone or edge of subsidence).", "Хөдөлгөөний хязгаар хүртэл буюу тогтвортой бүсийн/суултын зах хүртэл хэвтээгээс хэмжсэн өнцөг.", ""], ["Anisotropy", "Анизотропи", "The condition of having different physical properties in different directions, as in geologic strata that transmit seismic waves with different velocities in the vertical and horizontal directions, or rock mass strength dictated by the orientation of a dominant joint set. Antonym to isotropy.", "Чулуулгийн физик шинж чанар чиглэлээс хамааран өөр өөр байх төлөв; изотропийн эсрэг ойлголт.", ""], ["Apparent density", "Харагдах нягт", "The weight (W) of an object or material divided by its exterior volume (Ve) less the volume of its open pores (Vp). Apparent density = W/(Ve- Vp). (ACSG, 2", "Бодисын жинг задгай нүх сүвийн эзлэхүүнийг хассан гаднах эзлэхүүнд харьцуулсан нягт.", ""], ["Apparent stress", "Харагдах хүчдэл", "A model independent measure of the stress change at the seismic source, defined in terms of modulus of rigidity, seismic energy and moment. (SiM)", "Сейсмийн эх үүсвэр дэх хүчдэлийн өөрчлөлтийг хөшүүнгийн модуль, сейсмийн энерги ба моментод тулгуурлан тодорхойлсон хэмжигдэхүүн.", ""], ["Apparent volume", "Харагдах эзлэхүүн", "True volume plus closed-pore volume.", "Жинхэнэ эзлэхүүн дээр хаалттай нүх сүвийн эзлэхүүнийг нэмсэн нийлбэр.", ""], ["Apron feeder", "Хормогч тэжээгч", "A feeder in which the material is carried on an apron conveyor and in which the rate of feed is adjusted either by varying the depth of material or the speed of the conveyor, or both. Also called plate-belt feeder; plate feeder.", "Материалыг хормогч конвейероор зөөж, тэжээлийн хурдыг материалын үеийн зузаан, конвейерийн хурд эсвэл хоёуланг өөрчлөн тохируулдаг тэжээгч.", ""], ["Aquiclude", "Ус үл нэвтрүүлэх үе", "A body of relatively impermeable rock.", "Ус нэвтрүүлэх чанар маш бага чулуулгийн биет.", ""], ["Aquifer", "Ус агуулагч үе", "A formation or a part of a formation that is water bearing and capable of producing water, as from a well. An aquifer is not a stratum that merely contains water.", "Ус агуулж, худаг зэрэг байгууламжаар ус өгч чаддаг геологийн үе буюу формацийн хэсэг.", ""], ["Aquitard", "Ус муу нэвтрүүлэгч үе", "Low-permeability bed, in a stratigraphic sequence, of sufficient permeability to allow movement of contaminants, and to be relevant to regional ground-water flow, but of insufficient permeability for the economic production of water.", "Бохирдуулагчийн шилжилт болон бүс нутгийн газрын доорх усны урсгалд нөлөөлөхүйц боловч эдийн засгийн ашиглалтаар ус олборлоход хангалтгүй нэвчимтгий чанартай үе.", ""], ["Arch", "Нуман хэлбэрийн тааз", "The curved roof of underground opening that is supported by the openings sidewalls.", "Малталтын хажуу хануудаар тулгуурлагдсан нуман хэлбэрийн дээд гадарга.", ""], ["Arching", "Нуман тогтоц үүсэх үзэгдэл", "The formation of an at least temporarily stable arch of in situ or broken rock by the transmission of lateral inter-block lateral forces.", "In situ эсвэл бутарсан чулуулгийн блокуудын хоорондын хажуугийн хүчдэл дамжиж, түр хугацаанд тогтвортой нум үүсэх үзэгдэл.", ""], ["Assay", "Агуулгын шинжилгээ", "To analyze the proportions of metals in an ore; to test an ore or mineral for composition, purity, weight, or other properties of commercial interest.", "Хүдэр дэх металлын харьцаа, найрлага, цэвэршилт болон эдийн засгийн ач холбогдолтой шинжийг шинжлэх үйл явц.", ""], ["Attenuation (damping)", "Сулралт (сааруулалт)", "To weaken or reduce in force, intensity, effect, quantity, or value. In mining this can be a reduction in the amplitude of seismic waves or energy with distance due to the physical characteristics of the rock mass that produce divergence, reflection and scattering, and absorption. Or it can also describe the absorbtion of water in the cave by the muckpile. In many cases, attenuation is an exponential function of the path length through the medium.", "Сейсмийн долгионы далайц, энерги зайнаас хамааран чулуулгийн массивын тархалт, ойлт, сарнилалт, шингээлтийн нөлөөгөөр буурах зэрэг сулралтын үзэгдэл; мөн нуралтын бутарсан материал ус шингээхийг илэрхийлж болно.", ""], ["Atterberg limits", "Аттербергийн хязгаар", "In a sediment, the water-content boundaries between the semiliquid and plastic states (known as the liquid limit) and between the plastic and semisolid states (known as the plastic limit).", "Хурдасны хагас шингэнээс уян налархай төлөвт шилжих шингэний хязгаар болон уян налархайгаас хагас хатуу төлөвт шилжих хуванцар хязгаарыг тодорхойлсон усны агууламжийн заагууд.", ""], ["Atterberg test", "Аттербергийн туршилт", "A method for determining the plasticity of sediemnts in terms of the difference between the water content when the sediments are just coherent and when they begins to flow as a liquid, i.e. defining the Atterberg limits.", "Хурдасны уян налархай чанарыг усны агууламжийн өөрчлөлтөөр тодорхойлж, Аттербергийн хязгаарыг тогтоох туршилт.", ""], ["Attitude", "Чиглэл-налуугийн байрлал", "The relation of some directional feature in a rock to the horizontal plane. The attitude of planar features (bedding, foliations, joints, etc.) is described by the strike and the dip. The attitude of a linear feature (fold axis, lineation, etc.) is described by the strike of the horizontal projection of the linear feature and its plunge.", "Чулуулгийн хавтгай болон шугаман бүтцийн хэвтээ хавтгайтай харьцах чиглэл-байрлал; хавтгай бүтцийг азимут/уналтын чиглэл, налалтаар тодорхойлно.", ""], ["Attrition (abrasion)", "Үрэлт элэгдэл", "The act of wearing and smoothing of rock fragments during cave flow as they undergo secondary fragmentation, i.e. rubbing, grinding, scraping etc with resulting comminution in size.", "Нуралтын урсгалын үед чулуулгийн хэлтэрхийнүүд хоорондоо үрэлдэх, нунтаглах, хусагдах замаар хэмжээ нь багасах хоёрдогч бутралын процесс.", ""], ["Axial compression", "Тэнхлэгийн шахалт", "Compression applied parallel to the axis of the object.", "Биеийн тэнхлэгтэй параллель чиглэлд үйлчилсэн шахалт.", ""], ["Back", "Тааз / дээд хэсэг", "Term used mainly for the roof or upper part of any underground mining cavity. As applied to an arch, the outer or upper surface.", "Газар доорх малталтын тааз буюу дээд хэсгийг нэрлэнэ; нуман байгууламжийн гадна/дээд гадаргыг мөн ингэж нэрлэнэ.", ""], ["Block Cave Fragmentation (BCF)", "Блок нураалтын бутралын тооцооллын систем", "An expert system program developed by Dr. G S Esterhuizen for predicting the degree of fragmentation likely to be produced in a block or panel cave.", "Блок буюу панелийн нуралтаар үүсэх бутралын зэргийг урьдчилан тооцоолох эксперт системийн програм.", ""], ["Block caving", "Блок нураалтын арга", "A mass mining method in which a block of ore is undercut and, following the drawing of some of the broken ore, caves progressively. A general term that refers to a mass mining system where the extraction of the ore depends largely on the action of gravity. By removing a thin horizontal layer at the mining level of the ore column, using standard mining methods, the vertical support of the ore column above is removed and the ore then caves by gravity. As broken ore is removed from the mining level of the ore column, the ore above continues to break and cave by gravity. The term \"block caving\" probably originated in the porphyry copper mines, where the area to be mined was divided into rectangular blocks that were mined in a checkerboard sequence with all the ore in a block being removed before an adjacent block was mined. This sequence of mining is no longer widely used. Today most mines use a panel system, mining the panels sequentially or by establishing a large production area and gradually moving it forward as the first area caved becomes exhausted. The term \"block caving\" is used for all types of gravity caving methods. There are three major systems of block caving, and they are differentiated by the type of production equipment used. (1) The first system based on the original block cave system is the grizzly or gravity system and is a full gravity system wherein the ore from the drawpoints flows directly to the transfer raises after sizing at the grizzly and then is gravity loaded into ore cars. (2) The second system is the slusher system, which uses slusher scrapers for the main production unit. (3) The last system is the rubber-tired system, which uses load-haul-dump (LHD) units for the main production unit. Block caving has the lowest cost of all mine exploitation systems, with the exception of open pit mining or in situ recovery.", "Хүдрийн блокийг доороос тайрч, хэсэг хэмжээний бутарсан хүдрийг буулгасны дараа хүдрийн массивыг таталцлын хүчээр үе шаттай нураан олборлох бөөн олборлолтын арга.", ""], ["Block height", "Блокийн өндөр", "The height of the block to be caved from the extraction level to the surface, the base of a pre-existing open pit, a level or a mined-out area above.", "Олборлолтын түвшнээс гадарга, өмнөх ил уурхайн ёроол, дээд түвшин эсвэл олборлосон хоосон орон зай хүртэлх нурах блокийн өндөр.", ""], ["Bogging", "Нурсан/бутарсан хүдрийг ачих", "The process of extracting caved or broken ore from a cave or stope. Term sysnonomous to the terms drawing, loading, mucking and lashing.", "Нуралтаар бутарсан хүдрийг cave буюу олборлолтын малталтаас гарган ачих ажиллагаа; drawing, loading, mucking, lashing гэсэн нэртэй дүйцнэ.", ""], ["Brazilian test", "Бразилийн туршилт", "A method for the determination of the tensile strength of rock by applying a load vertically at the highest point of a test cylinder or disk.", "Чулуулгийн суналтын бат бэхийг цилиндр буюу диск хэлбэрийн дээжид ачаалал өгч тодорхойлох туршилт.", ""], ["Breakback", "Өрөмдлөгийн цооногоос хойш үүссэн бутралт", "The fractures caused by the shattering of a solid rock ledge back from the drill holes in which the charge was placed.", "Тэсрэх бодис байрлуулсан өрөмдлөгийн цооногоос хойш цул чулуулгийн ирмэг бутарч эвдэрсэн хагарал.", ""], ["Breakthrough", "Нэвт цооролт", "The opening made from the propagating cave into a older overlying underground workings or surface.", "Нуралтын тархалт өмнөх дээд малталт эсвэл газрын гадаргатай нэвт холбогдон нээлхий үүсэх үзэгдэл.", ""], ["Brow", "Дүүжилсэн ирмэг хэсэг", "The overhanging, often unsupported, near vertical face at the intersection of vertical or sub-vertical and horizontal excavated surfaces as at the interface between a drawpoint and a drawbell.", "Хүдэр буулгах цэг ба drawbell-ийн заагт үүсэх, ихэвчлэн тулгуургүй, босоо эсвэл босоо шахуу гадаргын дээд талын дүүжилсэн ирмэг.", ""], ["Bulk density", "Эзлэхүүний нягт", "The weight of an object or material divided by its volume, including the volume of its pore spaces;", "Бодисын жинг нүх сүвийн эзлэхүүнийг багтаасан нийт эзлэхүүнд харьцуулсан нягт.", ""], ["Bulkhead", "Хаалт хана", "A rock, steel, wood, or concrete wall-like structure primarily designed to resist earth, air or water pressure and prevent these from entering a working area of a mine", "Чулуулаг, ган, мод эсвэл бетоныг ашиглан газрын даралт, агаар, ус нэвтрэхээс хамгаалах зориулалттай хана хэлбэрийн хаалт.", ""], ["Bulking ( swelling)", "Эзлэхүүний тэлэлт", "The increase in volume of a mass of rock when it has caved or been otherwise broken and removed from its in situ state.", "Чулуулаг in situ төлвөөсөө нурах буюу бутрах үед эзлэхүүн нь нэмэгдэх үзэгдэл.", ""], ["Bulking factor", "Эзлэхүүний тэлэлтийн коэффициент", "The proportional increase in the volume of a mass of in situ rock when it has caved or bulked, usually represented by the symbol, B, so that an in situ volume, V, becomes a volume of V(1+B) on bulking. Note that Swell Factor = (1+B)", "In situ чулуулгийн эзлэхүүн нурсны дараа хэр хэмжээгээр нэмэгдсэнийг илэрхийлэх харьцааны үзүүлэлт.", ""], ["Bulk mining", "Бөөн олборлолт", "A method of mining in which large quantities of low-grade ore are mined without attempt to segregate the high-grade portions. As opposed to Selective Mining", "Өндөр агуулгатай хэсгийг ялгалгүйгээр их хэмжээний бага агуулгатай хүдрийг олборлох арга.", ""], ["Bulk sample", "Их хэмжээний дээж", "A large sample taken at regular, though widely spaced, intervals.", "Тогтмол боловч хоорондоо харьцангуй хол зайтай цэгүүдээс авсан их хэмжээний дээж.", ""], ["Bump", "Газар доорх сейсмийн цохилт", "An sesimic event caused by rock failure yet does not lead to any damage to the workings.", "Чулуулгийн эвдрэлээс үүссэн боловч уурхайн малталтад гэмтэл учруулаагүй сейсмийн үзэгдэл.", ""], ["Bull nose", "Гүдгэр хамар хэсэг", "A convex pillar or surface of less than 90o in plan at the entry to a drawpoint.", "Хүдэр буулгах цэгийн орох хэсэгт төлөвлөгөөний зураглал дээр 90°-аас бага өнцөгтэй гүдгэр цул/гадарга.", ""], ["Casing", "Цооногийн яндан", "Special steel tubing welded or screwed together and lowered into a borehole to prevent entry of loose rock, gas, or liquid into the borehole, to prevent loss of circulation liquid into porous, cavernous, or crevassed ground, and to support the sides of a borehole.", "Цооногийн ханын сул чулуулгийг тогтоох, хий/шингэн нэвтрэхээс сэргийлэх, угаалгын шингэний алдагдлыг бууруулах зориулалтаар цооногт суулгадаг ган яндан.", ""], ["Camel back", "Гүдгэр нуруу хэсэг", "A convex pillar or surface of more than 90o in plan at the entry to a drawpoint.", "Хүдэр буулгах цэгийн орох хэсэгт төлөвлөгөөний зураглал дээр 90°-аас их өнцөгтэй гүдгэр цул/гадарга.", ""], ["Call", "Олборлолтын захиалгат хэмжээ", "The number of buckets per drawpoint to be drawn over a specified period. The Call is released for the entire level at the same time. The Call also contains a bogging order to be adhered to by the operations team.", "Тодорхой хугацаанд нэг хүдэр буулгах цэгээс буулгах хувин буюу ачих хэмжээгээр илэрхийлсэн захиалга; түвшний хэмжээнд зэрэг гаргана.", ""], ["Caveability", "Нурах чадвар", "A measure (often non-quantitative) of the ability of an orebody to cave under particular circumstances.", "Тодорхой нөхцөлд хүдрийн биет өөрөө нурах чадварыг хэмжих үзүүлэлт.", ""], ["Cave back (Cave crown)", "Нуралтын дээд гадарга", "The under-surface of the in situ, but possibly disturbed, rock above a cave or muckpile (caved ore).", "Нуралтын буюу бутарсан хүдрийн овоолгын дээр орших in situ, зарим талаар эвдэрсэн чулуулгийн доод гадарга.", ""], ["Caved Zone", "Нурсан бүс", "This region consists of rock blocks that are moving towards the draw points in response to production. This region is also referred to as the mobilised zone. The cave zone in the numerical model has been defined by those zones that have experienced a displacement greater than 1 m. This criterion was established though the back-analysis of the Northparkes E26 Lift 2 cave.", "Олборлолтын нөлөөгөөр хүдэр буулгах цэгүүд рүү шилжиж буй бутарсан чулуулгийн бүс; мобилизацлагдсан бүс гэж мөн нэрлэнэ.", ""], ["Cave front (cave face)", "Нуралтын фронт (нуралтын нүүр)", "The steep interface between the in situ, uncaved rock mass and the advancing cave. Typically represents the lateral extent of the active, advancing undercut face.", "In situ, нураагүй чулуулгийн массив ба урагшилж буй нуралтын хоорондох огцом зааг; идэвхтэй доороос тайралтын мөргөцгийн хажуугийн тархалтыг илэрхийлнэ.", ""], ["Cave induction", "Нураалт өдөөх", "The process of inducing caving by some technique in addition to, or other than, undercutting (e.g. drilling and blasting or hydraulic fracturing).", "Доороос тайрахаас гадна өрөмдлөг-тэсэлгээ, гидравлик ан цавжуулалт зэрэг аргаар нуралтыг зориудаар өдөөх процесс.", ""], ["Cave initiation", "Нураалт эхлүүлэх", "The process of the initiation of “natural” caving by undercutting and drawing some of the broken ore.", "Доороос тайралт хийж, хэсэг бутарсан хүдрийг буулгах замаар байгалийн нуралтыг эхлүүлэх процесс.", ""], ["Cave monitoring", "Нураалтын мониторинг", "Measurements of the rock mass’ response to caving, typically focussed on tracking the cave propagation, cave subsidence and underground infrastructure stability.", "Нуралтад чулуулгийн массив хэрхэн хариу үйлдэл үзүүлж байгааг хэмжих; нуралтын тархалт, газрын суулт, далд уурхайн дэд бүтцийн тогтвортой байдлыг хянах ажиллагаа.", ""], ["Cave propagation", "Нураалтын тархалт", "The process of propagation of an initiated cave by the progressive drawing of broken ore in a planned and controlled manner.", "Эхэлсэн нуралтыг төлөвлөгөөтэй, хяналттайгаар бутарсан хүдрийг үе шаттай буулгаж дээш тархаах процесс.", ""], ["Caving", "Нураалт", "The process of the detachment of in situ rock from the cave back.", "Нуралтын дээд гадаргаас in situ чулуулгийн хэсэг салж нурах процесс.", ""], ["Caving rate", "Нураалтын хурд", "The average rate, usually expressed in mm per day, at which the cave naturally propagates upwards.", "Нуралтын фронт дээш байгалийн жамаар тархах дундаж хурд, ихэвчлэн мм/өдөрөөр илэрхийлнэ.", ""], ["Cavity (cave)", "Хөндий (нуралтын хөндий)", "A natural underground opening or void, which may be small or large.", "Газрын доорх байгалийн хөндий буюу хоосон орон зай; хэмжээ нь бага эсвэл их байж болно.", ""], ["Chimney caving or chimneying", "Яндан хэлбэрийн нураалт", "The progressive migration of an underground cavity through the overlying material to the surface, usually over a restricted plan area.", "Газрын доорх хөндий дээрх материалыг нэвтлэн газрын гадарга руу хязгаарлагдмал талбайгаар аажмаар дээш тархах нуралт.", ""], ["Clamping stress", "Хавчих хүчдэл", "The normal compressive stress exerted across structures such that it increases their shear strength and ultimately enhances stability.", "Бүтцийн гадаргууг хэвийн чиглэлд шахаж, шилжилтийн бат бэхийг нэмэгдүүлэн тогтвортой байдлыг сайжруулдаг шахалтын хүчдэл.", ""], ["Closure (convergence)", "Хаагдалт (ойртолт)", "A reduction in the dimensions of an opening", "Малталтын хэмжээс багасах үзэгдэл.", ""], ["Closure meter", "Хаагдалт хэмжигч", "An instrument for indicating the amount of closure that has taken place. Roof and wall closure in mines is measured using this instrument.", "Малталтын хаагдалтын хэмжээг хэмжих багаж; уурхайн тааз ба ханын ойртолтыг хэмжинэ.", ""], ["CMS (cave management system)", "CMS (нуралтын удирдлагын систем)", "Software developed by Gemcom to provide the dispatch system with an optimum call to achieve the planned schedule.", "Төлөвлөсөн хуваарийг хэрэгжүүлэхэд шаардлагатай оновчтой хүдэр буулгалтын захиалгыг dispatch системд өгөх зориулалттай Gemcom-ийн програм.", ""], ["CMS (cavity monitoring system)", "CMS (хөндийн хяналтын систем)", "This is a laser scanner device that maps void volumes", "Хоосон орон зайн эзлэхүүнийг лазер сканнердаж зураглал гаргах төхөөрөмж.", ""], ["Coefficient of friction", "Үрэлтийн коэффициент", "Constant of proportionality relating normal stress and corresponding critical shear stress at which sliding starts between surfaces.", "Хоёр гадаргуу хооронд гулсалт эхлэх үеийн хэвийн хүчдэл ба критик шилжилтийн хүчдэлийн хамаарлыг илэрхийлэх коэффициент.", ""], ["Cohesion", "Барилдлага", "Property that enables the sticking together in opposition to forces tending to separate them. In rock mechanics, assuming Coulomb theory, the cohesion of a discontinuity is its shear strength at zero normal stress.", "Салгах хүчний эсрэг материалыг хооронд нь барьж тогтоох шинж; Кулоны онолоор ан цавын барилдлага нь хэвийн хүчдэл тэг үедх шилжилтийн бат бэх юм.", ""], ["Collapse", "Нуралт / нурж унах", "To cave or fall in.", "Нурах буюу дотогш унах үзэгдэл.", ""], ["Column Height", "Баганын өндөр", "Is the height of the broken ground to surface overlying the drawpoint, and its mass has a significant bearing on the seondary fragmentation process", "Хүдэр буулгах цэгийн дээрх бутарсан чулуулгийн гадарга хүртэлх босоо баганын өндөр; хоёрдогч бутралд чухал нөлөөтэй.", ""], ["Compaction (re-compaction)", "Нягтралт (дахин нягтралт)", "The reorienttion and reshaping of the caved rock due a loading such that it becomes tightly packed and reduces in volume. This may occur in response to the overlying weight of the rock in the column or the closure of the cave back such that the vertical stresses are transmitted onto the caved rock.", "Ачааллын нөлөөгөөр нурсaн чулуулгийн блокууд дахин байршин нягтарч, эзлэхүүн нь багасах процесс.", ""], ["Competent rock", "Бат бөх тогтвортой чулуулаг", "Rock that, because of its physical and geological characteristics, is capable of withstanding an applied load under given conditions without falling or collapsing.", "Физик ба геологийн шинж чанараараа өгөгдсөн нөхцөлд үйлчилж буй ачааллыг нурахгүйгээр даах чадвартай чулуулаг.", ""], ["Comminution (grinding)", "Бутлалт (нунтаглалт)", "Size reduction into fine particles; The process of erosion by which rock fragments are worn down, crushed, sharpened, or polished through the frictional effect of continued contact and pressure by larger fragments.", "Чулуулгийн хэсгүүд үрэлт, даралтын давтан үйлчлэлээр элэгдэж, бутарч, хэмжээ нь багасах процесс.", ""], ["Consolidation", "Шахагдан нягтрах процесс", "The gradual reduction in volume and increase in density of a soil mass in response to increased load or effective compressive stress (i.e. compaction), followed by some form of cementation of the material. I.e. The process of compaction followed by the process of cementation.", "Ачаалал буюу үр ашигт шахалтын хүчдэл нэмэгдэхэд хөрсний эзлэхүүн багасаж, нягт нь нэмэгдэх, улмаар материал цементжих процесс.", ""], ["Continuous subsidence", "Тасралтгүй суулт", "The smooth or even downwards movement of the surface over a mined area. The area exhibits elastic deformation or continuous non elastic strain. Movement is only just measurable- 2mm or greater.", "Олборлосон талбайн дээр газрын гадарга жигд, тасралтгүй доошлох хөдөлгөөн.", ""], ["Continuous trough contiuous trench (layout)", "Тасралтгүй ховилон / шуудуу хэлбэрийн зохион байгуулалт", "This layout involves undercutting from the extraction level by developing a longitudinal undercut trough using long-holes drilled from drifts runnining along the axes of the major apex. The construction of the associated production drifts and drawpoints follow behind on same level. This layout has no minor apices.", "Үндсэн оройн тэнхлэгүүдийн дагуу урт цооногоор уртааш доороос тайралтын ховил үүсгэж, үйлдвэрлэлийн малталт ба хүдэр буулгах цэгүүдийг араас нь байгуулах зохион байгуулалт.", ""], ["Convergence", "Ойртолт", "See closure.", "Closure-ийг үзнэ үү: малталтын хэмжээсүүд хоорондоо ойртон багасах үзэгдэл.", ""], ["Core2Frag", "Core2Frag бутралын таамаглалын програм", "Fragmentation prediction software developed by Call & Nicholas, INC.", "Core2Frag бутралын таамаглалын програм — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Coyote Blast", "Coyote тэсэлгээ", "A infamous cave induction method whereby a small tunnel with cross cuts are driven above a hung cave. It is in the ends of these crosscuts that large quantities of explosives are generally placed, and the remaining space in the tunnel is filled up with rock, sand, timbers, or concrete, to act as stemming or tamping. The charge is then detonated in at attempt to reinitiate continuous caving – a blasting engineers fantasy.", "Тасралтгүй нуралтыг дахин эхлүүлэх зорилгоор тусгайлан бэлтгэсэн тэсэлгээний арга/ажиллагаа.", ""], ["Cave Propagation Factor (CPF)", "Нураалтын тархалтын коэффициент (CPF)", "A caveability index defined (by Flores and Karzulovic) as the ratio between the average deviotoric stress acting on the cave back and the maximum deviotoric stress that the rock mass can sustain. The CPF can be thought of as the inverse of the “Factor of Safety” commonly used in geotechnical engineering, thus if CPF > 1 then caveability should prove unproblematic. .", "Нуралтын дээш тархалтын хурдтай холбоотой тооцооллын коэффициент.", ""], ["Crater (Breakthrough zone)", "Кратер (нэвт цооролтын бүс)", "The area where the cave breaches the surface and the failed material moves vertically down into the cave muck pile.", "Нуралтын гадаргад илэрч, нэвт цооролтын бүсээр илэрхийлэгдэх кратер хэлбэрийн суулт/эвдрэл.", ""], ["Creep", "Удаан мөлхөө деформаци", "The slow and imperceptible, time-dependent deformation of material that results from a lengthy application of a stress. Part of the creep is a permanent deformation, whilst part of the deformation is elastic and the specimen can recover.", "Чулуулаг, хөрсний тогтмол хүчдэл эсвэл ачааллын үед хугацааны явцад аажмаар деформацид орох үзэгдэл.", ""], ["Crinkle cut (Narrow inclined) undercut", "Crinkle cut (нарийн налуу доороос тайралт)", "A type of undercut whereby only a narrow stope is blasted along the major apex and across the top of the drawbell. The purpose of shaping the major apex is to aid in the self-cleaning of the undercut to avoid stacking and choke blasting conditions. In addition the undulating cave backis believed to promote instability in the cave back. The word ‘crinckle cut’ making reference to a South African brand of potatoe crisp whose shape is analogous to the chevron shape of the undercut back.", "Crinkle cut (нарийн налуу доороос тайралт) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Crosscut", "Хөндлөн малталт", "In general, any drift driven between any two openings for any mining purpose.", "Хөндлөн малталт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Crown pillar", "Дээд хамгаалалтын цул", "A horizontal pillar of unmined rock left above a caved or mined-out area.", "Дээд хамгаалалтын цул — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Cubby (cubby hole, cuddy)", "Жижиг хөндий малталт", "A niche cut in the rib or wall of an underground mine for the storage of explosives or detonators.", "Жижиг хөндий малталт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Cutoff grade", "Хязгаарын агуулга", "The lowest grade of mineralized material that qualifies as ore in a given deposit; rock of the lowest assay included in an ore estimate.", "Хязгаарын агуулга — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Daylight", "Гадаргад ил гарах", "When an underground mine working (such as a propagating cave) meets the surface it is said to daylight.", "Гадаргад ил гарах — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Dead load (Static load)", "Өөрийн жин (статик ачаалал)", "The downward pressure on a structure caused by gravity only.", "Өөрийн жин (статик ачаалал) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Decline (Ramp)", "Доош чиглэсэн налуу малталт (рамп)", "A sloping underground opening, developed downwards, for machine access from level to level or from surface", "Доош чиглэсэн налуу малталт (рамп) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Deformation", "Деформаци", "The process of deforming a material through a driving force, such as deforming rock under stress.", "Деформаци — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Deformation angle (Angle of subsidence)", "Деформацийн өнцөг (суултын өнцөг)", "is the angle measured from the horizontal to the limit of movement (i.e. edge of the stable zone or edge of subsidence).", "Деформацийн өнцөг (суултын өнцөг) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Density (Unit Weight)", "Нягт (эзлэхүүн жин)", "The mass of a substance per unit volume (in mining this is typically tonnes per cubic metre). True density is its mass (m) divided by volume (v) excluding voids. For liquids and solids, it equals specific gravity (SG). In geomechanics the term is frequently used in place of unit weight .", "Нягт (эзлэхүүн жин) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Depletion", "Нөөцийн хомсдол", "The act of reducing, or exhausting ore reserves.", "Нөөцийн хомсдол — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Depletion surface", "Нөөц дууссан хэсгийн гадарга", "A depletion surface may represent actual draw or planned draw and is created from joining a 3D array of points representing broken draw heights above the draw points in a cave.", "Нөөц дууссан хэсгийн гадарга — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Deposit (mineral deposit or Ore deposit)", "Ордын биет (эрдсийн орд / хүдрийн орд)", "An informal term used to designate a natural occurrence of a useful mineral, or an ore, in sufficient extent and degree of concentration to invite exploitation.", "Ордын биет (эрдсийн орд / хүдрийн орд) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Destressed area", "Хүчдэл буурсан бүс", "A region of low stress or lower stress than the surrounds. Usually as a result to some stress barrier such as an excavation or the process of destressing.", "Хүчдэл буурсан бүс — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Destressing", "Хүчдэл бууруулах", "The process of relieving high stresses. Typically performed by drilling and blasting a highly stressed area adjacent to an excavation. This has the affect of reducing the load bearing capacity of the near field rock mass, thereby transferring these high stresses deeper into the undisturbed rock, and ultimately creating a protective barrier.", "Хүчдэл бууруулах — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Develop", "Малталт нэвтрэх / бэлтгэн хөгжүүлэх", "To traverse an orebody by shaft sinking and tunnelling,", "Малталт нэвтрэх / бэлтгэн хөгжүүлэх — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Dilatancy", "Дилатанси", "An increase in the bulk volume of a granular mass during deformation, caused by a change from close-packed structure to open-packed structure, accompanied by an increase in the pore volume. The latter is accompanied by rotation of grains, microfracturing, and grain boundary slippage.", "Дилатанси — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Dilation", "Тэлэлт", "Deformation by a change in volume but not shape", "Тэлэлт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Dilution", "Бохирдолт", "The contamination of the target ore with barren country rock or unwanted lower grade material.", "Бохирдолт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Dilution Entry", "Бохирдлын оролт", "The percentage of the ore column that has been drawn before dilution appears at the drawpoint (Laubscher, 1994). This is a reflection of the amount of mixing that occurs in the draw column. The percentage dilution entry (D) is calculated as : D = (A – HIZ) / A x C x 100 where A = draw column height x swell factor and C = draw control factor.", "Бохирдлын оролт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Discontinuity", "Тасралтгүй бус байдал / ан цавт бүтэц", "A collective term used for mechanical breaks, fractures or discontinuities in rock masses having low or zero tensile strengths.", "Тасралтгүй бус байдал / ан цавт бүтэц — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Discontinuous subsidence", "Тасалдсан суулт", "The downwards movement of the surface above a mined area producing a surface profile that is not smooth or even but contains breaks or steps involving vertical or sub-vertical surfaces.", "Тасалдсан суулт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Dispatching system", "Олборлолтын диспетчерийн систем", "A communication system for directing the orderly and efficient control of the movements of LHDs in achieving the given production call.", "Олборлолтын диспетчерийн систем — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Displacement", "Шилжилт", "A general term for describing the amount of deformation or movement of a rock mass.", "Шилжилт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Distortion", "Хэлбэрийн гажилт", "The process of distorting. In relation to photography, it implies any shift in the position of an image on a photograph that alters the perspective characteristics of the photograph.", "Хэлбэрийн гажилт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Draw (pull)", "Хүдэр буулгалт (таталт)", "The process of extracting caved or broken ore from a cave or stope.", "Хүдэр буулгалт (таталт) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Drawbell", "Хүдэр буулгалтын хонхор", "The excavated structure, ideally having the shape of an inverted bell, which channels caved or broken ore to a drawpoint.", "Хүдэр буулгалтын хонхор — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Draw column", "Хүдэр буулгалтын багана", "The vertical, approximately cylindrical, column of caved ore and dilution, drawn through a single drawpoint or a group of adjacent drawpoints. Note draw column height ≠ column or block height", "Хүдэр буулгалтын багана — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Drawcone (IMZ)", "Хүдэр буулгалтын конус (IMZ)", "The shape of the surface defining the limits of movement of particles being drawn from a drawpoint below.", "Хүдэр буулгалтын конус (IMZ) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Draw control", "Хүдэр буулгалтын хяналт", "The process of controlling the amounts of ore drawn from individual drawpoints in order to achieve a number of mining objectives. The process of controlling the amounts of ore drawn from individual drawpoints in order to achieve a number of mining objectives.", "Хүдэр буулгалтын хяналт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Draw control factor", "Хүдэр буулгалтын хяналтын коэффициент", "Is a measure of the variation in the tonnages drawn from the working drawpoints", "Хүдэр буулгалтын хяналтын коэффициент — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Drawdown", "Хүдэр буулгалтын явц / доош таталт", "The vertical lowering of caved rock in the draw column or groundwater in the rock formations from their original levels.", "Хүдэр буулгалтын явц / доош таталт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Draw erosion", "Хүдэр буулгалтаас үүсэх элэгдэл", "A mechanism whereby a drawzone (IMZ) widens as a function of the overlying stress forcing the stagnant material adjacent to the low pressure, active drawzone.", "Хүдэр буулгалтаас үүсэх элэгдэл — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Drawpoint", "Хүдэр буулгах цэг", "A loading point on the extraction level where caved rock is extracted from the cave using LHDs, slushers or any other means of loading.", "Хүдэр буулгах цэг — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Drawpoint drift", "Хүдэр буулгах цэгийн малталт", "An opening or drift through which a drawpoint is accessed from a production drift on the extraction or production level.", "Хүдэр буулгах цэгийн малталт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Drawpoint spacing", "Хүдэр буулгах цэгүүдийн хоорондын зай", "The spacing in plan between like points in adjacent drawpoints, defined in a number of possible ways. Conventionally this is defined this as the distance between adjacent drapoints across the minor apex.", "Хүдэр буулгах цэгүүдийн хоорондын зай — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Drawpoint yield (productivity)", "Хүдэр буулгах цэгийн бүтээмж", "The amount of tonnes draw through a drawpoint.", "Хүдэр буулгах цэгийн бүтээмж — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Draw interaction", "Хүдэр буулгалтын харилцан үйлчлэл", "Mecahnisms whereby the movement of material in one drawzone may be influenced by that in another neighboring drawzone. Draw interaction does not imply interactive draw between adjacent drawzones, nor does it preclude isolated draw from occuring.", "Хүдэр буулгалтын харилцан үйлчлэл — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Draw rate", "Хүдэр буулгалтын хурд", "The rate, often expressed as tonnes per day or shift, at which caved or broken ore is drawn from individual drawpoints or a group of adjacent drawpoints.", "Хүдэр буулгалтын хурд — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Draw schedule", "Хүдэр буулгалтын хуваарь", "The well planned allocation of draw tonnes for each drawpoint over the life of the mine to ensure the maximum possible recovery of ore..", "Хүдэр буулгалтын хуваарь — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Draw sequence", "Хүдэр буулгалтын дараалал", "The planned order of draw for each drawpoint to achieve a desired outcome.", "Хүдэр буулгалтын дараалал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Drawzone", "Хүдэр буулгалтын бүс", "The volume of caved material that will eventually report to a particular drawpoint during progressive draw.", "Хүдэр буулгалтын бүс — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Drift", "Хэвтээ малталт", "A horizontal excavation in or near an orebody driven from one working place to another. It is usually of a relatively small cross section compared with larger sections which are usually referred to as tunnels.", "Хэвтээ малталт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Drive", "Малталт нэвтрэлт", "The process of excavating horizontally, or at an inclination, as in a drift, tunnel, or decline. Distinguished from sinking and raising. The term is also used to describe a production tunnel developed to access the orebody, as distinct from a crosscut which contain the drawpoints. (Palabora is an exception in that they call their production drives crosscuts, in that they connect the north and south perimeter drives).", "Малталт нэвтрэлт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Effective pillar area", "Цулын үр ашигт талбай", "The of solid rock core area within the fractured and crushed edges of a pillar.", "Цулын үр ашигт талбай — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Effective porosity", "Үр ашигт сүвэрхэг чанар", "The property of rock or soil containing intercommunicating voids, expressed as a percent of bulk volume occupied by these voids.", "Үр ашигт сүвэрхэг чанар — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["El Teniente layout (= Teniente layout)", "Эль Теньентеийн зохион байгуулалт", "A production/extraction level layout attributed to the El Teniente Mine in Chile.", "Эль Теньентеийн зохион байгуулалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Ellipsoid of motion (Draw ellipsoid, IEZ)", "Хөдөлгөөний эллипсоид (буулгалтын эллипсоид, IEZ)", "An approximately ellipsoidal zone within a mass of caved or broken ore or rock from which all the material discharged from a bottom outlet after a given period of time will have originated.", "Хөдөлгөөний эллипсоид (буулгалтын эллипсоид, IEZ) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Elasticity", "Уян чанар", "A material property that describes the ability of the material to sustain stress without permanent deformation; the term is also used to denote conformity to the law of stress-strain proportionality. An elastic stress or elastic strain is a stress or strain within the elastic limit.", "Уян чанар — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Elastic limit", "Уян харимхайн хязгаар", "The greatest stress that can be developed in a material without permanent deformation remaining when the stress is released.", "Уян харимхайн хязгаар — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Excavation", "Малталт / ухалт", "The process of removing soil and/or rock materials from one location and transporting them to another. It includes digging, blasting, breaking, loading, and hauling, either at the surface or underground.", "Малталт / ухалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Excavation ratio", "Малталтын харьцаа", "The ratio of the plan area or volume of excavated rock to the total plan area or volume of rock considered. The term is used with respect to the extraction or production level (Brown, 2007).", "Малталтын харьцаа — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Expansion Void", "Тэлэлтийн хөндий", "See Air gap", "Тэлэлтийн хөндий — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Extraction", "Олборлолт", "The process of mining and removal of ore from a mine.", "Олборлолт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Extraction ratio", "Олборлолтын харьцаа", "Ratio of the mined volumes to the total volumes. Also called strip ratio.", "Олборлолтын харьцаа — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Extraction level (production level)", "Олборлолтын түвшин (үйлдвэрлэлийн түвшин)", "The level in a caving mine through which the caved or broken ore is extracted and transported away from the cave (Brown, 2007).", "Олборлолтын түвшин (үйлдвэрлэлийн түвшин) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Extraction level layout", "Олборлолтын түвшний зохион байгуулалт", "The arrangement of production and drawpoint drifts, drawpoints and other excavations on the extraction or production level.", "Олборлолтын түвшний зохион байгуулалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Fabric (rock fabric)", "Чулуулгийн бүтэц (fabric)", "The complete spatial and geometrical configuration of all those components that make up a deformed rock. It covers such terms as texture, structure, and preferred orientation, and so is an all encompassing term that describes the shapes and characters of individual components of a rock mass and the manner in which these parts are distributed and oriented in space (Hobbs, Means and Williams, 1976, p73)", "Чулуулгийн бүтэц (fabric) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Face", "Малталтын мөргөцөг / ил гарсан нүүр", "The exposed surface of an ore deposit in the working place where mining is proceeding.", "Малталтын мөргөцөг / ил гарсан нүүр — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Factor of safety", "Аюулгүйн коэффициент", "The ratio of the ultimate breaking strength of the material to the force exerted against it.", "Аюулгүйн коэффициент — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Fall of ground", "Чулуулаг нурах үзэгдэл", "Rock falling from the roof into a mine opening.", "Чулуулаг нурах үзэгдэл — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Failure", "Эвдрэл / бат бэхийн алдагдал", "The condition in which the maximum strength of a material is exceeded by an applied force.", "Эвдрэл / бат бэхийн алдагдал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Fan Drill Undercut", "Сэнсэн өрөмдлөгийн доороос тайралт", "To drill a number of blastholes each in a different horizontal or vertical direction from a single drill setup. These holes are used to blast and advance the undercut face.", "Сэнсэн өрөмдлөгийн доороос тайралт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Fault", "Хагарал", "A fracture or a fracture zone in crustal rocks along which there has been displacement of the two sides relative to one another parallel to the fracture. The displacement may be a few millimetres or many kilometres long.", "Хагарал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Fill", "Дүүргэгч материал", "Manmade deposits of natural earth materials (e.g., rock, soil, and gravel) and waste materials (e.g., tailings or spoil from dredging), used to fill an enclosed space, such as an old stope or chamber in a mine", "Дүүргэгч материал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Fines", "Нарийн ширхэгт материал", "Finely crushed or powdered material, as contrasted with the coarser fragments. The term is often used to describe the clay and silt sized particles that pass through the No. 200 sieve (i.e. diameters less than 0.074 mm).", "Нарийн ширхэгт материал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Fines migration", "Нарийн ширхэгт материалын шилжилт", "The process whereby fines material within the draw column flows rapidly downwards in comparison to the larger rocks comprising the draw column.", "Нарийн ширхэгт материалын шилжилт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Flow (cave flow)", "Урсгал (нуралтын урсгал)", "The mass movement of unconsolidated caved rock under the influence of gravity, in response to the tonnage drawn through the drawpoints on the extraction level.", "Урсгал (нуралтын урсгал) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Flow ellipsoid", "Урсгалын эллипсоид", "The approximately ellipsoidal shape of the volume of caved or broken material which moves or “flows” when a bottom outlet is opened or draw occurs. See draw ellipsoid", "Урсгалын эллипсоид — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Forepoling (spiling)", "Урьдчилсан бэхэлгээний шон / өрөмдлөг (spiling)", "A method of advancing a very weak tunnel roof comprising of loose, caving, or watery ground by driving spiles, poles or long bolts at low angles to the horizontal into the ground ahead.", "Урьдчилсан бэхэлгээний шон / өрөмдлөг (spiling) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Fracman", "FracMan программ", "Sotware developed by Golder Associates that is commonly used to construct discrete fracture network models that stochastically represent the rock mass.", "FracMan программ — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Fracture", "Хагарал / ан цав", "A mechanical discontinuity in a rock.", "Хагарал / ан цав — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Friction", "Үрэлт", "The force between two surfaces tending to resist relative motion, being caused by the roughness of the surfaces of the bodies and acting tangentially between them.", "Үрэлт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Fracture initition angle", "Ан цав үүсэх эхлэлийн өнцөг", "The angle measured from the horizontal at the edge of the extraction level to the edge of the fractured zone.", "Ан цав үүсэх эхлэлийн өнцөг — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Fractured zone", "Ан цавжсан бүс", "This area encompasses all of the obvious surface deformations and extends from the Line of Break (crater edge) to the onset of tensile cracking on the surface. Adjacent to the crater this zone is characterised by large radial cracks and typically rotational and toppling mode failures.", "Ан цавжсан бүс — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Fragmentation", "Бутрал", "The process, or the result, of blasting, caving and draw of initially in situ rock or ore.", "Бутрал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Front caving", "Фронтын нураалт", "A variant of block caving in which the cave is retreated on one or more levels from an initiating slot in the centre or on the boundary of the block.", "Фронтын нураалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Frozen cave", "Зогсонги нуралт", "A term used to describe a cave back that is not propagating under steady draw conditions, also referred to as a ‘hung cave’.", "Зогсонги нуралт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Friction angle", "Үрэлтийн өнцөг", "See Angle of friction", "Үрэлтийн өнцөг — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Geohydrology", "Гидрогеологи", "Refer to hydrogeology", "Гидрогеологи — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Geological Strength Index (GSI)", "Геологийн бат бэхийн индекс (GSI)", "A rock mass classification scheme developed by Dr E Hoek as an index for use in estimating the strength and deformability of jointed rock masses.", "Геологийн бат бэхийн индекс (GSI) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Geophone (seismometer)", "Геофон (сейсмометр)", "A seismic detector that produces a voltage proportional to the displacement, velocity, or acceleration of ground motion, within a limited frequency range.", "Геофон (сейсмометр) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Geophysical log (borehole survey)", "Геофизикийн каротаж (цооногийн судалгаа)", "A graphic record of the measured or computed physical characteristics of the rock section encountered in a well, plotted as a continuous function of depth. Measurements are made by a sonde as it is withdrawn from the borehole by a wire line. Several measurements are usually made simultaneously, and the resulting curves are displayed side by side on a common depth scale. Both the full display and the individual curves are called logs. Well logs are commonly referred to by generic type, such as resistivity log and radioactivity log, or by specific curve type, such as sonic log and gamma-ray log.; geophysical log; wire-line log", "Геофизикийн каротаж (цооногийн судалгаа) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Geophysics", "Геофизик", "A branch of physics dealing with the Earth, including its atmosphere and hydrosphere. It includes the use of seismic, gravitational, electrical, thermal, radiometric, and magnetic phenomena to elucidate processes of dynamical geology and physical geography, and makes use of geodesy, geology, seismology, meteorology, oceanography, magnetism, and other Earth sciences in collecting and interpreting Earth data. Geophysical methods have been applied successfully to the identification of underground structures in the Earth and to the search for structures of a particular type.", "Геофизик — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Geostatistics", "Геостатистик", "A methodology for the analysis of spatially correlated data. The characteristic feature is the use of variograms or related techniques to quantify and model the spatial correlation structure. Also includes the various techniques such as kriging, which utilise spatial correlation models.", "Геостатистик — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Geotechnical", "Геотехникийн", "The application of scientific methods and engineering principles to the acquisition, interpretation, and use of knowledge of materials of the Earth's crust for the solution of engineering problems. It embraces the fields of soil mechanics and rock mechanics, and many of the engineering aspects of geology, geophysics, hydrology, and related sciences.", "Геотехникийн — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Geohydrology (hydrogeology)", "Гидрогеологи", "A term referring to the hydrologic or flow characteristics of subsurface waters.", "Гидрогеологи — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Glory hole", "Босоо хүдэр буулгах нээлхий", "A surface crater resulting from a chimney cave, block cave or progressive hangingwall/footwall failure. Also a method of mining which is a combination opencast and underground mining system, whereby quarried material from a vertical pit, gravitates or is moved to a short shaft, from the bottom of which it is delivered to an underground transport system.", "Босоо хүдэр буулгах нээлхий — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Gouge", "Ан цавын дүүргэгч шаварлаг материал", "A layer of soft, earthy or clayey, fault-comminuted rock material along the wall of a a fault or shear zone, so named because a miner can \"gouge\" it out to facilitate the mining of the vein itself. Also called clay gouge.or fault gouge, if associated with fault activity.", "Ан цавын дүүргэгч шаварлаг материал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Grade", "Агуулга", "The relative quantity or the percentage of ore-mineral or metal content in an orebody. The term is also used synonymously for gradient and describes the degree of inclination, or a rate of ascent or descent, with respect to the horizontal, of a road, railroad, embankment, conduit, or other engineering structure; it is expressed as a ratio (vertical to horizontal), a fraction (such as m/km or ft/mi), or a percentage (of horizontal distance).", "Агуулга — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Gradeline", "Агуулгын шугам", "A line defining the intended grade of a roadway that is being driven. Such a line is used to control the gradient of a roadway.", "Агуулгын шугам — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Gravity draw", "Хүндийн хүчний хүдэр буулгалт", "The drawing of caved or broken ore by gravity, usually through a series of finger raises and ore passes connecting the cave to a lower transportation level.", "Хүндийн хүчний хүдэр буулгалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Ground control", "Чулуулгийн массивын тогтворжилтын хяналт", "Maintaining rock mass stability by controlling the movement of excavations in the ground, typically through the use of rock reinforcement.", "Чулуулгийн массивын тогтворжилтын хяналт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Ground movement", "Газрын шилжилт", "Subsidence due to the caving or collapse of underground workings.", "Газрын шилжилт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Ground noise (rock noise)", "Чулуулгийн суурь дуу чимээ", "Seismic disturbance of the ground not caused by the shot.", "Чулуулгийн суурь дуу чимээ — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Gravity flow", "Хүндийн хүчний урсгал", "The flow of broken material under the influence of gravity.", "Хүндийн хүчний урсгал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Groundwater", "Газрын доорх ус", "Loosely, all subsurface water as distinct from surface water.", "Газрын доорх ус — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Grizzly", "Бүдүүн ширхэгийн шигшүүр / гризли", "A structure made of parallel steel beams or bars through which broken rock of up to a maximum size may pass under the influence of gravity.", "Бүдүүн ширхэгийн шигшүүр / гризли — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Hangingwall caving", "Өлгүүр ханын нураалт", "The usually progressive failure or caving of the hangingwall rock overlying the inclined boundary of a mined orebody.", "Өлгүүр ханын нураалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Hangup", "Гацалт", "The trapping or wedging of one or more usually large blocks in or above the drawpoint or drawbell such that they will not move further by gravity.", "Гацалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Hardness scale (Mohs scale)", "Хатуулагийн шатлал (Моосын шатлал)", "The scale by which the hardness of a mineral is determined as compared with a standard. The Mohs scale is as follows: talc, gypsum, calcite, fluorite, apatite, orthoclase, quartz, topaz, corundum, and diamond.", "Хатуулагийн шатлал (Моосын шатлал) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Hard-rock mining", "Хатуу чулуулгийн олборлолт", "Mining that takes place in igneous and metamorphic rock by means of drilling and blasting to extract the ore.", "Хатуу чулуулгийн олборлолт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Haulage level", "Тээвэрлэлтийн түвшин", "The level in an underground mine through which the ore and waste is transported away from the production area to crushers or for transport to the surface.", "Тээвэрлэлтийн түвшин — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Haul-cycle time", "Тээврийн мөчлөгийн хугацаа", "The time it takes the LHD to haul a load to the dumping area and return to position in the drawpoint loading area.", "Тээврийн мөчлөгийн хугацаа — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Hauling", "Тээвэрлэлт", "The conveying of material to and from the working places or ore from the drawpoints to the materials handling system.", "Тээвэрлэлт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Hazard", "Аюул", "A potential occurrence or condition that could lead to injury, delay, economic loss or damage to the environment.", "Аюул — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Head grade", "Эх агуулга", "The average grade of ore fed into a mill.", "Эх агуулга — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Heading", "Малталтын мөргөцөг", "The end of a tunnel or drift that is being advanced by the mining operation.", "Малталтын мөргөцөг — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Height of draw (HOD)", "Хүдэр буулгалтын өндөр (HOD)", "---------", "Хүдэр буулгалтын өндөр (HOD) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["The Height of interaction zone (HIZ)", "Харилцан үйлчлэлийн бүсийн өндөр (HIZ)", "The vertical height at the base of the cave within which adjacent draw zones interact and produce lateral motion of caved ore.", "Харилцан үйлчлэлийн бүсийн өндөр (HIZ) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Herringbone layout", "Ясны нуруу хэлбэрийн зохион байгуулалт", "Extraction level layout where the minor apices are in line with each other and perpendicular to the major apex. This layout is believed to offer greater pillar stability and greater LHD efficiency than the El Teniente layout.", "Ясны нуруу хэлбэрийн зохион байгуулалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Hoist (hoister or winder)", "Өргүүр (өргөх машин)", "A power-driven windlass for raising ore, rock, or other material from a mine and for lowering or raising people and material.", "Өргүүр (өргөх машин) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Hoisting", "Өргөх тээвэрлэлт", "Winding in a mine.", "Өргөх тээвэрлэлт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Hole deviation (hole curvature)", "Цооногийн хазайлт (цооногийн муруйлт)", "The amount, expressed in degrees, that a borehole has diverged from its intended course in a distance of 100 ft (30 m).", "Цооногийн хазайлт (цооногийн муруйлт) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["hole through", "Цооногоор нэвт гарсан хэсэг", "Successful meeting of two approaching tunnel heads, or of winze and raise, or of a drill hole into an excavation.", "Цооногоор нэвт гарсан хэсэг — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Hopper", "Бункер", "A vessel into which materials are fed, usually constructed in the form of an inverted pyramid or cone terminating in an opening through which the materials are discharged (not primarily intended for storage).", "Бункер — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Hydraulic fracturing (hydorfracture)", "Гидравлик ан цавжуулалт", "Hydraulic fracturing involves the high-pressure underground injection of large amounts of water and/or other fluids into the rock mass to form open fractures that can be propped open with sand and/or other materials. For caving the objectice being to reduce the rock mass strength, reduce fragmentation size and promote cave propagation.", "Гидравлик ан цавжуулалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Hydraulic radius", "Гидравлик радиус", "In the context of underground mining, the ratio of the surface area to the perimeter of an excavated surface such as the roof of an undercut.", "Гидравлик радиус — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Hydrogeology", "Гидрогеологи", "The area of geology that deals with the distribution and movement of groundwater in the soil and rocks of the Earth's crust. The term geohydrology is often used interchangeably. Some make the minor distinction between a hydrologist or engineer applying themselves to geology (geohydrology), and a geologist applying themselves to hydrology (hydrogeology).", "Гидрогеологи — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Hydrology", "Ус судлал", "The scientific study of the properties, distribution, and effects of water on the earth's surface, in the soil and underlying rocks, and in the atmosphere.", "Ус судлал — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Hydrostatic pressure (hydrostatic stress)", "Гидростатик даралт (гидростатик хүчдэл)", "A state of stress in which the normal stresses acting on any plane are equal and where shearing stresses do not exist in the material, i.e. the stress is uniform in all directions. The hydrostatic pressure of ground water is generally due to the weight of water at higher levels in the zone of saturation.", "Гидростатик даралт (гидростатик хүчдэл) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Hypocentre", "Гипоцентр", "The idealised point source of a seismic event, defined in the 3D space.", "Гипоцентр — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Impermeable (impervious)", "Ус үл нэвтрүүлэх", "Said of a rock that does not permit the passage of fluids under the pressure conditions ordinarily found in the subsurface.", "Ус үл нэвтрүүлэх — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Incline (Ramp)", "Налуу малталт (рамп)", "A sloping underground opening, developed upwards, for machine access from level to level or from surface", "Налуу малталт (рамп) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Inclined drawpoint caving", "Налуу хүдэр буулгах цэгийн нураалт", "A form of cave mining in which the drawpoints are developed not on a horizontal but on an inclined plane, often parallel with the footwall of an inclined orebody.", "Налуу хүдэр буулгах цэгийн нураалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Inclined undercut", "Налуу доороос тайралт", "A form of undercut in which the floor and roof are inclined at significant angles to the horizontal and which takes a chevron or zig-zag shape in vertical section.", "Налуу доороос тайралт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Induced caving", "Өдөөгдсөн нураалт", "See Cave induction", "Өдөөгдсөн нураалт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Infrastructure", "Дэд бүтэц", "The basic facilities, roads and installations needed for the functioning of a system.", "Дэд бүтэц — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Injection pressure", "Шахалтын даралт", "The total amount of pressure required to force a liquid or grout into fractures, cavities, and pores in rocks or other materials.", "Шахалтын даралт — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["In situ", "Байрлалд нь / in situ", "In the natural or original position. Applied to a rock, soil, or stress etc, occurring in the original, unaltered state prior to mining.", "Байрлалд нь / in situ — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Intact Rock Strength (IRS)", "Бүтэн чулуулгийн бат бэх (IRS)", "Typically this is defined as the unconfined compressive strength (UCS) of an intact rock specimen and thus excludes the influence of any discontinuities. Laubscher goes further and has defined a nomogram which calculates a “corrected IRS” for samples which comprise a mix of both strong and weak rock – essentially he downgrades the strong rock portion as a percentage of the weak rock.", "Бүтэн чулуулгийн бат бэх (IRS) — энэ нэр томьёог уурхайн олборлолт, чулуулгийн массив болон нураалтын технологийн хүрээнд дээрх англи тодорхойлолтын утгаар хэрэглэнэ.", ""], ["Intercepts", "Огтлолцсон интервал", "That portion included between two po
