<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Block Cave — Уурхайн нэр томьёо</title>
<style>
:root{font-family:"Segoe UI",system-ui,sans-serif;color:#eaf2f1;background:#101919;color-scheme:dark;--panel:#192524;--line:#354743;--muted:#aabdb6;--accent:#bdec98}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid var(--line)}.top,main,footer{width:min(1160px,calc(100% - 36px));margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}.brand{font-weight:850;font-size:24px;letter-spacing:-.04em}.brand span{color:var(--accent)}nav,.letters,.controls{display:flex;gap:8px;flex-wrap:wrap}button,input,select{font:inherit;color:inherit}button,select{border:1px solid var(--line);padding:9px 13px;border-radius:9px;background:var(--panel);cursor:pointer}button:hover,button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.hero{margin:26px 0 18px;padding:clamp(24px,5vw,56px);border:1px solid #415749;border-radius:22px;background:repeating-linear-gradient(156deg,transparent 0 30px,#bdec9809 30px 31px),linear-gradient(110deg,#223933,#14221e)}.hero small{color:var(--accent);font-size:14px;font-weight:650}.hero h1{font-size:clamp(33px,6vw,64px);line-height:1.03;margin:12px 0;letter-spacing:-.052em}.hero p{margin:0;color:#bfd3c9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:32px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px}.stat b{display:block;font-size:30px;color:var(--accent)}.stat span{color:var(--muted);font-size:14px}h2{margin-bottom:12px}.controls input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:12px}.letters{margin:14px 0}.letters button{padding:5px 9px;font-size:14px}#status,footer,.meta{color:var(--muted)}#results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.term{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;overflow-wrap:anywhere}.term header{display:flex;align-items:start;gap:10px;justify-content:space-between;border:0}.term h3{margin:0;line-height:1.25}.term h3 span{display:block;color:var(--accent);font-size:16px;margin-top:5px;font-weight:600}.term summary{cursor:pointer;font-size:14px;color:var(--muted);margin-top:13px}.term p{line-height:1.55;margin-bottom:0}.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:24px 0}button:disabled{opacity:.4;cursor:default}footer{border-top:1px solid var(--line);padding:18px 0 26px;font-size:14px}@media(max-width:640px){#results{grid-template-columns:1fr}.top{align-items:start}.brand{font-size:20px}.top button{font-size:14px}.stat{padding:10px}.stat b{font-size:24px}}
</style><style>
:root.light{color-scheme:light;background:#eef4ed;color:#182923;--panel:#fff;--line:#bdcdc2;--muted:#41594d;--accent:#27613b}.light .hero{background:repeating-linear-gradient(156deg,transparent 0 30px,#4e955522 30px 31px),linear-gradient(110deg,#d3efcf,#e9f5e5);border-color:#a4c0a5}.light .hero p{color:#38574b}.learn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:32px}.learn>div{border-radius:18px;border:1px solid var(--line);background:var(--panel);padding:18px;min-width:0}.learn h2{margin-top:0}.learn h3{margin-top:12px}.learn .term{padding:12px;margin-bottom:8px}.learn progress{width:100%;accent-color:var(--accent);margin:10px 0}.learn .title-row{display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap}.learn .title-row h2{margin-bottom:6px}@media(max-width:680px){.learn{grid-template-columns:1fr}.top{flex-wrap:wrap}}
</style><style>.definition-image{display:block;max-width:100%;max-height:32rem;height:auto;object-fit:contain;margin:16px auto 0;border-radius:10px}</style></head><body>
<header><div class="top"><div class="brand"><span>◆</span> Block Cave</div><nav aria-label="Үндсэн цэс"><button id="all" aria-pressed="true">Нэр томьёо</button><button id="saved" aria-pressed="false">Хадгалсан</button><button id="theme" aria-pressed="false">☀ Цайвар</button></nav></div></header>
<main><section class="hero"><small>АНГЛИ · МОНГОЛ</small><h1>Уурхайн нэр томьёоны толь</h1><p>Нэр томьёо, орчуулга, тодорхойлолтыг нэг дороос хай.</p></section>
<section class="stats" aria-label="Тойм"><div class="stat"><b id="total">0</b><span>Нийт нэр томьёо</span></div><div class="stat"><b id="initials">0</b><span>Англи эхний үсэг</span></div><div class="stat"><b id="countSaved">0</b><span>Хадгалсан нэр томьёо</span></div></section>
<section class="learn" id="learning" aria-label="Суралцах"><div><div class="title-row"><h2>Өнөөдрийн нэр томьёо</h2><button id="random">⚄ Санамсаргүй үг</button></div><div id="daily"></div></div><div><div class="title-row"><h2>Өөрийгөө шалгах</h2><button id="next-quiz">Дараагийн карт</button></div><span id="progress" class="meta"></span><progress id="study-progress" aria-label="Суралцах явц"></progress><div id="quiz"></div></div></section><section id="dictionary"><h2 id="heading">Нэр томьёо</h2><div class="controls"><input id="search" type="search" aria-label="Нэр томьёо хайх" placeholder="Жишээ нь: drawbell, тулгуурын хүчдэл"><select id="sort" aria-label="Эрэмбэлэх"><option value="en">Англи A–Z</option><option value="mn">Монгол А–Я</option></select><button id="reset">Цэвэрлэх</button></div><div id="letters" class="letters" aria-label="Эхний үсгээр шүүх"></div><p id="status" role="status"></p><div id="results"></div><div class="pager" id="pager"><button id="prev">Өмнөх</button><span id="position"></span><button id="next">Дараах</button></div></section></main>
<footer id="data-source-status" role="status">Өгөгдлийн эх үүсвэрийг шалгаж байна…</footer>
<script>
(async () => {
const el = id => document.getElementById(id);
const sourceName = 'Google Sheets';
const sourceStatus = el('data-source-status');
async function loadGlossary() {
  try {
    const source = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQzzKTwRYU8uWvuANW0d7s-I5xK4uwF0QhwJIiQlCWGYZX0MbkLXvOTQ6yfJdzPmT38ykXIFpWIK36R/pub?gid=129970236&single=true&output=csv";
    const response = await fetch(source, {cache: 'no-cache'});
    if (!response.ok) throw new Error('Эх үүсвэр HTTP ' + response.status + ' хариу өглөө.');
    const csv = (await response.text()).replace(/^\uFEFF/, '');
    const rows = [];
    let row = [], field = '', quoted = false;
    const separator = csv.split(/\r?\n/, 1)[0].includes(';') ? ';' : ',';
    for (let i = 0; i < csv.length; i++) {
      const char = csv[i];
      if (char === '"' && (quoted || !field)) {
        if (quoted && csv[i + 1] === '"') { field += '"'; i++; }
        else quoted = !quoted;
      } else if (!quoted && (char === separator || char === '\n' || char === '\r')) {
        row.push(field);
        field = '';
        if (char !== separator) {
          rows.push(row);
          row = [];
          if (char === '\r' && csv[i + 1] === '\n') i++;
        }
      } else field += char;
    }
    if (quoted) throw new Error('CSV файл бүрэн уншигдсангүй.');
    if (row.length || field) rows.push([...row, field]);
    const headers = ['English Term', 'Монгол нэр', 'English Definition', 'Монгол тайлбар'];
    if (!rows[0] || !headers.every((header, i) => rows[0][i]?.trim() === header)) throw new Error('Нийтэлсэн табын эхний мөрөнд нэр томьёоны дөрвөн баганын гарчиг байх ёстой.');
    const entries = rows.slice(1).filter(row => row.some(value => value.trim()));
    if (!entries.length || entries.some(row => row.length < 4 || !row[0].trim())) throw new Error('Нэр томьёоны мөрүүдийн өгөгдлийг шалгана уу.');
    sourceStatus.textContent = 'Google Sheets · ' + entries.length + ' нэр томьёо уншлаа.';
    return entries.map(row => row.map(value => value.trim()));
  } catch (error) {
    const detail = error instanceof TypeError ? 'Холбоос болон нийтлэх эрхийг шалгана уу.' : error.message;
    sourceStatus.textContent = sourceName + ' уншигдсангүй. ' + detail + '';
    return null;
  }
}
const terms = await loadGlossary() || [];
const makeId = row => JSON.stringify(row.slice(0, 2));
const letters = [...new Set(terms.map(row => row[0][0]?.toUpperCase()).filter(c => /^[A-Z]$/.test(c)))].sort();
let stored = [];
try { stored = JSON.parse(localStorage.getItem('cavelex-saved') || '[]'); } catch {}
const favorites = new Set(Array.isArray(stored) ? stored.filter(id => typeof id === 'string') : []);
const nodes = {};
let onlySaved = false, initial = '', page = 0;
const pageSize = 12;
const normalize = text => text.normalize('NFKC').toLocaleLowerCase();
const records = terms.map(row => ({row, id: makeId(row), haystack: normalize(row.join(' '))}));
function make(tag, content){const node = document.createElement(tag); if(content !== undefined) node.textContent=content; return node;}
function termCard({row, id}){
 const [en,mn,enDefinition,mnDefinition,imageUrl]=row;
 const card=make('article'); card.className='term';
 const head=make('header'), name=make('h3',en), star=make('button',favorites.has(id)?'★':'☆');
 if(mn) name.append(make('span',mn));
 star.setAttribute('aria-pressed',favorites.has(id)); star.setAttribute('aria-label','Хадгалах · '+en);
 star.onclick=()=>{
   if(favorites.has(id)) favorites.delete(id); else favorites.add(id);
   try{localStorage.setItem('cavelex-saved',JSON.stringify([...favorites]));}catch{}
   if(onlySaved) render(); else {
     star.textContent=favorites.has(id)?'★':'☆';
     star.setAttribute('aria-pressed',favorites.has(id));
     el('countSaved').textContent=favorites.size;
   }
 };
 head.append(name,star); card.append(head);
 if(enDefinition || mnDefinition){
   const details=make('details'); details.append(make('summary','Тодорхойлолт'));
   if(mnDefinition){const p=make('p',mnDefinition);p.lang='mn'; details.append(p);}
   if(enDefinition){const p=make('p',enDefinition);p.lang='en'; details.append(p);}
   const imageName = en.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
   if (imageName) {
     details.addEventListener('toggle', () => {
       if (!details.open || details.dataset.imageChecked) return;
       details.dataset.imageChecked = 'true';
       const imageSources = ['webp', 'png', 'jpg', 'jpeg'].map(ext => './images/' + imageName + '.' + ext);
       if (/^(https:\/\/|(?:\.\/)?images\/)/i.test(imageUrl || '')) imageSources.unshift(imageUrl);
       const picture = make('img');
       picture.className = 'definition-image';
       picture.alt = (mn || en) + ' — зураг';
       picture.decoding = 'async';
       const loadNext = () => {
         const source = imageSources.shift();
         if (source) picture.src = source;
       };
       picture.onerror = loadNext;
       picture.onload = () => details.append(picture);
       loadNext();
     });
   }
   card.append(details);
 }
 return card;
}
function render(){
 const words=normalize(el('search').value.trim()).split(/\s+/).filter(Boolean);
 const sortMn=el('sort').value==='mn';
 const matches=records.filter(({row,id,haystack})=>(!onlySaved || favorites.has(id)) && (!initial || row[0][0]?.toUpperCase()===initial) && words.every(word=>haystack.includes(word)));
 matches.sort((a,b)=>a.row[Number(sortMn)].localeCompare(b.row[Number(sortMn)],sortMn?'mn':'en'));
 const pages=Math.max(1,Math.ceil(matches.length/pageSize));
 page=Math.min(page,pages-1);
 el('results').replaceChildren(...matches.slice(page*pageSize,(page+1)*pageSize).map(termCard));
 el('status').textContent=matches.length?matches.length+' нэр томьёо олдлоо':onlySaved && !favorites.size?'Од дээр дарж нэр томьёо хадгална.':'Хайлтад тохирох нэр томьёо олдсонгүй.';
 el('countSaved').textContent=favorites.size;
 el('position').textContent=(page+1)+' / '+pages; el('pager').style.display=pages>1?'flex':'none';
 el('prev').disabled=page===0; el('next').disabled=page+1>=pages;
 for(const key of Object.keys(nodes)) nodes[key].setAttribute('aria-pressed',key===initial);
}
for(const letter of ['',...letters]){const button=make('button',letter||'Бүгд');button.onclick=()=>{initial=letter;page=0;render();};nodes[letter]=button;el('letters').append(button);}
function switchView(saved){onlySaved=saved;initial='';page=0;el('search').value='';el('all').setAttribute('aria-pressed',!saved);el('saved').setAttribute('aria-pressed',saved);el('heading').textContent=saved?'Хадгалсан нэр томьёо':'Нэр томьёо';render();}
el('all').onclick=()=>switchView(false);el('saved').onclick=()=>switchView(true);
el('search').oninput=el('sort').onchange=()=>{page=0;render();};
el('reset').onclick=()=>{el('search').value='';el('sort').value='en';initial='';page=0;render();};
el('prev').onclick=()=>{page--;render();el('status').scrollIntoView({block:'center'});};
el('next').onclick=()=>{page++;render();el('status').scrollIntoView({block:'center'});};
el('total').textContent=terms.length;el('initials').textContent=letters.length;render();

const toolsPanel=el('learning'), today=el('daily'), quiz=el('quiz');
const themeKey='cavelex-theme', learnedKey='cavelex-learned';
function loadLocal(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback;}catch{return fallback;}}
function saveLocal(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch{}}
const learned=new Set(loadLocal(learnedKey,[]).filter(id => typeof id === 'string'));
const date=new Date();
const day=Math.floor(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/86400000);
if (records.length) today.append(termCard(records[day%records.length]));
function setTheme(light){document.documentElement.classList.toggle('light',light);el('theme').setAttribute('aria-pressed',light);el('theme').textContent=light?'☾ Бараан':'☀ Цайвар';saveLocal(themeKey,light);}
setTheme(loadLocal(themeKey,false));
el('theme').onclick=()=>setTheme(!document.documentElement.classList.contains('light'));
let current=-1;
function randomRecord(){const remaining=records.filter(record=>record.id!==current&&!learned.has(record.id));return (remaining.length?remaining:records)[Math.floor(Math.random()*(remaining.length||records.length))];}
function showQuiz(){
 if (!records.length) return;
 const record=randomRecord();current=record.id;
 el('progress').textContent=learned.size+' / '+terms.length+' сурсан';
 el('study-progress').value=learned.size;
 quiz.replaceChildren(make('h3',record.row[0]));
 const reveal=make('button','Хариуг харах');
 reveal.onclick=()=>{
  quiz.replaceChildren(termCard(record));
  const known=make('button',learned.has(current)?'✓ Сурсан':'Сурсан гэж тэмдэглэх');
  known.disabled=learned.has(current);
  known.onclick=()=>{learned.add(record.id);saveLocal(learnedKey,[...learned]);showQuiz();};
  quiz.append(known);
 };
 quiz.append(reveal);
}
el('study-progress').max=terms.length;
el('next-quiz').onclick=showQuiz;
el('random').onclick=()=>{
 const record=records[Math.floor(Math.random()*records.length)];
 switchView(false); el('search').value=record.row[0]; render();
 el('dictionary').scrollIntoView({behavior:'smooth'});
};
el('random').disabled = el('next-quiz').disabled = !records.length;
showQuiz();
})();
</script></body></html>
